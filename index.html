<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SiNilai — SMP-IT Majma'ul Bahrain</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --em:#1a6b4a;--em2:#145439;--em3:#0e3d2b;--em-light:#e8f5ef;--em-mid:#b2d9c6;
  --gold:#c9a84c;--gold2:#a8872e;--gold-light:#fdf6e3;
  --bg:#f4f7f5;--card:#fff;--border:#dce8e1;
  --text:#1a2e25;--text2:#4a6858;--text3:#8aab97;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(26,107,74,.10);--shadow-lg:0 8px 32px rgba(26,107,74,.15);
  --sidebar-w:260px;--header-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Playfair Display',serif}

/* LOADING */
#loading-screen{position:fixed;inset:0;background:var(--em3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#loading-screen.hide{opacity:0;pointer-events:none}
.loader-logo{width:80px;height:80px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse 1.8s infinite}
.loader-logo svg{width:44px;height:44px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.5)}70%{box-shadow:0 0 0 20px rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}
.loader-title{color:#fff;font-size:28px;font-family:'Playfair Display',serif;margin-bottom:6px}
.loader-sub{color:var(--em-mid);font-size:13px;letter-spacing:.5px}
.loader-bar{width:180px;height:3px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:28px;overflow:hidden}
.loader-fill{height:100%;background:var(--gold);border-radius:4px;animation:fill 2.2s ease forwards}
@keyframes fill{from{width:0}to{width:100%}}

/* LOGIN */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#1a2e25;background-size:cover;background-position:center}
#login-screen.hide{display:none}
.login-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(14,61,43,.92),rgba(26,107,74,.80))}
.login-box{position:relative;background:rgba(255,255,255,.97);border-radius:24px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.3);z-index:1}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.login-logo-img{width:52px;height:52px;border-radius:12px;background:var(--em);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;position:relative}
.login-logo-img img{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px}
.login-logo-text h2{font-size:22px;color:var(--em);line-height:1.1}
.login-logo-text p{font-size:11px;color:var(--text3);margin-top:2px}
.login-role-tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--em-light);padding:5px;border-radius:var(--radius-sm)}
.role-tab{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:.2s}
.role-tab.active{background:var(--em);color:#fff;box-shadow:0 2px 8px rgba(26,107,74,.3)}
.login-error{background:#fff0f0;border:1px solid #fca5a5;color:#dc2626;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;display:none}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;letter-spacing:.3px}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,107,74,.35)}

/* LAYOUT */
#app{display:none;min-height:100vh}
#app.show{display:flex}
#sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--em3),var(--em2));min-height:100vh;display:flex;flex-direction:column;transition:transform .3s,width .3s;position:fixed;left:0;top:0;bottom:0;z-index:200;overflow:hidden}
#sidebar.collapsed{width:0;transform:translateX(-100%)}
.sidebar-header{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;position:relative}
.brand-logo img{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px}
.brand-name h3{color:#fff;font-size:17px;font-family:'Playfair Display',serif;white-space:nowrap}
.brand-name p{color:rgba(255,255,255,.5);font-size:10px;margin-top:1px;white-space:nowrap}
.sidebar-user{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--em3);font-weight:700;font-size:14px;flex-shrink:0}
.user-detail p{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.user-detail span{color:rgba(255,255,255,.5);font-size:11px;text-transform:capitalize}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-section{padding:8px 18px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;color:rgba(255,255,255,.7);transition:.2s;border-left:3px solid transparent;font-size:14px;font-weight:500;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(201,168,76,.15);color:var(--gold);border-left-color:var(--gold)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.btn-logout-side{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);color:rgba(255,255,255,.7);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s}
.btn-logout-side:hover{background:rgba(220,38,38,.2);color:#fca5a5;border-color:rgba(220,38,38,.3)}

/* MAIN */
#main{flex:1;margin-left:var(--sidebar-w);transition:margin .3s;display:flex;flex-direction:column;min-height:100vh}
#main.expanded{margin-left:0}

/* HEADER */
#header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.btn-toggle{width:36px;height:36px;border-radius:8px;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:.2s;flex-shrink:0}
.btn-toggle:hover{background:var(--em-light);color:var(--em)}
.header-title{flex:1;min-width:0}
.header-title h2{font-size:17px;color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-title p{font-size:11px;color:var(--text3);margin-top:1px}
.header-date{font-size:11px;color:var(--text3);text-align:right;white-space:nowrap}
.btn-header-logout{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#fee2e2;border:1.5px solid #fca5a5;border-radius:var(--radius-sm);color:#dc2626;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;white-space:nowrap;flex-shrink:0}
.btn-header-logout:hover{background:#dc2626;color:#fff;border-color:#dc2626}
.btn-header-logout svg{width:14px;height:14px;flex-shrink:0}
/* pastikan tombol keluar selalu tampil */
.btn-header-logout{visibility:visible!important;opacity:1!important}

/* CONTENT */
#content{flex:1;padding:24px;overflow-y:auto;overflow-x:hidden}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:14px;transition:.2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:24px;height:24px}
.stat-info p{font-size:24px;font-weight:700;color:var(--text);line-height:1}
.stat-info span{font-size:12px;color:var(--text3);font-weight:500;margin-top:4px;display:block}

/* SECTION */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.section-title{font-size:18px;font-weight:700;color:var(--text)}
.section-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* TABLE */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:var(--em-light);color:var(--em);font-weight:700;padding:11px 13px;text-align:left;border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.data-table td{padding:10px 13px;border-bottom:1px solid #f0f4f2;color:var(--text);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#fafcfb}
.data-table .actions{display:flex;gap:5px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s;border:none;white-space:nowrap}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn-primary{background:var(--em);color:#fff}
.btn-primary:hover{background:var(--em2)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold2)}
.btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.btn-danger:hover{background:#dc2626;color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--em);color:var(--em);background:var(--em-light)}
.btn-icon{padding:6px}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-em{background:var(--em-light);color:var(--em)}
.badge-gold{background:var(--gold-light);color:var(--gold2)}
.kelas-chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--em-light);color:var(--em)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.hide{display:none}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal-header{padding:22px 26px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-header h3{font-size:17px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;line-height:1}
.modal-close:hover{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.modal-body{padding:0 26px 24px}
.modal-footer{padding:0 26px 24px;display:flex;gap:10px;justify-content:flex-end}

/* FORM */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.3px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:#fff;color:var(--text);transition:.2s;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(26,107,74,.1)}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;transition:.2s}
.checkbox-item:has(input:checked){border-color:var(--em);background:var(--em-light);color:var(--em)}
.checkbox-item input{accent-color:var(--em)}

/* TOAST */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:slideIn .3s ease;max-width:280px}
.toast-success{background:var(--em);color:#fff}
.toast-error{background:#dc2626;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* PROGRESS */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex:1}
.progress-fill{height:100%;background:var(--em);border-radius:3px;transition:.3s}
.nilai-progress-row{display:flex;align-items:center;gap:10px}
.nilai-count{font-size:11px;color:var(--text3);white-space:nowrap}

/* GURU NILAI TABLE */
.kelas-tabs{display:flex;gap:6px;flex-wrap:wrap}
.kelas-tab{padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:#fff;transition:.2s;white-space:nowrap}
.kelas-tab.active{background:var(--em);color:#fff;border-color:var(--em)}
.mapel-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.mapel-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:#fff;transition:.2s}
.mapel-tab.active{background:var(--gold);color:#fff;border-color:var(--gold)}

/* Nilai tabel scroll penuh di HP & laptop */
.nilai-table-outer{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);background:#fff;width:100%;display:block}
.nilai-table{border-collapse:collapse;font-size:12.5px;white-space:nowrap;width:max-content;min-width:100%}
.nilai-table th{background:var(--em);color:#fff;padding:10px 10px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.3px}
.nilai-table th.col-sticky{position:sticky;z-index:6;background:var(--em)}
.nilai-table th.col-sticky-0{left:0}
.nilai-table th.col-sticky-1{left:42px}
.nilai-table td{padding:8px 10px;border-bottom:1px solid #edf2ef;text-align:center;vertical-align:middle;background:#fff}
.nilai-table td.col-sticky{position:sticky;background:#fff;z-index:3;box-shadow:2px 0 4px rgba(0,0,0,.05)}
.nilai-table td.col-sticky-0{left:0;text-align:center;min-width:42px}
.nilai-table td.col-sticky-1{left:42px;text-align:left;font-weight:600;min-width:150px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.nilai-table tr:hover td{background:#f7fcf9}
.nilai-table tr:hover td.col-sticky{background:#f0f8f3}
.nilai-table th.col-final{background:var(--gold)}
.nilai-table td.col-final{font-weight:700;color:var(--em);background:#fffdf5!important}
.nilai-input{width:58px;padding:5px 4px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:inherit;outline:none;transition:.2s;background:#fff}
.nilai-input:focus{border-color:var(--em);box-shadow:0 0 0 2px rgba(26,107,74,.1)}
.saving-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);animation:blink .8s infinite;margin-left:4px;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

/* MOBILE CARDS */
.siswa-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;transition:.2s}
.siswa-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.siswa-card-header{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.siswa-avatar{width:42px;height:42px;border-radius:50%;background:var(--em-light);display:flex;align-items:center;justify-content:center;color:var(--em);font-weight:700;font-size:16px;flex-shrink:0}
.siswa-card-info h4{font-size:15px;font-weight:700}
.siswa-card-info p{font-size:12px;color:var(--text3);margin-top:2px}
.expand-panel{background:var(--em-light);border-radius:var(--radius-sm);padding:14px;margin-top:10px;display:none}
.expand-panel.open{display:block}
.expand-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* LEGGER */
.legger-table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.legger-table{border-collapse:collapse;font-size:11px}
.legger-table th,.legger-table td{border:1px solid #ccc;padding:5px 8px;white-space:nowrap}
.legger-table th{background:var(--em);color:#fff;font-weight:700;text-align:center}
.legger-table td{text-align:center}
.legger-table tr:nth-child(even) td{background:#f9fafb}
.legger-table .col-nama{text-align:left;font-weight:600}

/* PENGATURAN */
.setting-card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:18px}
.setting-card h3{font-size:14px;font-weight:700;color:var(--em);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover{border-color:var(--em);background:var(--em-light)}
.upload-zone img{max-height:80px;max-width:260px;object-fit:contain;margin-bottom:8px;display:block;margin-left:auto;margin-right:auto}
.upload-zone p{font-size:12px;color:var(--text3)}

/* BOTTOM NAV */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:150;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.bottom-nav-items{display:flex;justify-content:space-around}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px;cursor:pointer;color:var(--text3);transition:.2s;border-radius:8px;min-width:52px}
.bnav-item.active{color:var(--em)}
.bnav-item svg{width:22px;height:22px}
.bnav-item span{font-size:10px;font-weight:600}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}

/* ── SISWA NILAI INPUT ── */
.siswa-input-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px}
.siswa-input-card h3{font-size:15px;font-weight:700;color:var(--em);margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.semester-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
@media(max-width:768px){.semester-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:400px){.semester-grid{grid-template-columns:repeat(2,1fr)}}
.semester-box{background:var(--bg);border:2px solid var(--border);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;transition:.2s;cursor:text}
.semester-box:focus-within{border-color:var(--em);background:var(--em-light)}
.semester-box label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:8px;cursor:default}
.semester-box input{width:100%;text-align:center;font-size:24px;font-weight:700;border:none;outline:none;background:transparent;color:var(--em);font-family:inherit;display:block}

<script>
// ═══ FIREBASE ═══
const firebaseConfig={apiKey:"AIzaSyBiv-YC0KLaq6ecCc6gSlgGhdbnxulSt6c",databaseURL:"https://sinilai-majmaulbahrain-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"sinilai-majmaulbahrain"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// ═══ STATE ═══
let currentUser=null,currentRole=null,loginRole='admin';
let allUsers=[],allMapel=[],allSiswa=[],allNilai={},pengaturan={};
let activeMenu=null,debounceTimers={};
let selectedKelasGuru='IX-1',selectedMapelGuru=null;
let selectedMapelSiswa=null;

// ═══ INIT ═══
window.onload=async()=>{
  updateDate();setInterval(updateDate,60000);
  await loadPengaturan();applyPengaturan();
  setTimeout(()=>{
    document.getElementById('loading-screen').classList.add('hide');
    document.getElementById('login-screen').classList.remove('hide');
  },2400);
};
function updateDate(){
  const el=document.getElementById('header-date');
  if(el)el.textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
async function loadPengaturan(){
  return new Promise(r=>{db.ref('/pengaturan').once('value',s=>{pengaturan=s.val()||{};r();});});
}
function applyPengaturan(){
  if(pengaturan.logo){
    ['logo-img-el','sidebar-logo-img'].forEach(id=>{
      const el=document.getElementById(id);
      if(el){el.src=pengaturan.logo;el.style.display='block';}
    });
    const li=document.getElementById('login-logo-img');
    if(li)li.querySelector('svg')&&(li.querySelector('svg').style.display='none');
    const bl=document.getElementById('brand-logo');
    if(bl)bl.querySelector('svg')&&(bl.querySelector('svg').style.display='none');
  }
  if(pengaturan.fotoLatar)document.getElementById('login-screen').style.backgroundImage=`url(${pengaturan.fotoLatar})`;
}

// ═══ LOGIN ═══
function setLoginRole(role){
  loginRole=role;
  document.querySelectorAll('.role-tab').forEach((t,i)=>t.classList.toggle('active',['admin','guru','siswa'][i]===role));
  document.getElementById('form-user').style.display=role!=='siswa'?'block':'none';
  document.getElementById('form-siswa').style.display=role==='siswa'?'block':'none';
  document.getElementById('login-error').style.display='none';
}
async function loadSiswaDrp(){
  const kelas=document.getElementById('sel-kelas-login').value;
  const sel=document.getElementById('sel-nama-login');
  sel.innerHTML='<option value="">-- Pilih Nama --</option>';
  if(!kelas)return;
  const snap=await db.ref('/siswa').once('value');
  const val=snap.val()||{};
  const arr=Array.isArray(val)?val.filter(Boolean):Object.values(val).filter(Boolean);
  arr.filter(s=>s&&s.kelas===kelas).sort((a,b)=>a.nama.localeCompare(b.nama)).forEach(s=>{
    const o=document.createElement('option');o.value=s.id;o.textContent=s.nama;sel.appendChild(o);
  });
}
async function doLogin(){
  const errEl=document.getElementById('login-error');
  errEl.style.display='none';
  function showErr(m){errEl.textContent=m;errEl.style.display='block';}
  if(loginRole==='siswa'){
    const kelas=document.getElementById('sel-kelas-login').value;
    const sid=document.getElementById('sel-nama-login').value;
    if(!kelas||!sid){showErr('Pilih kelas dan nama siswa');return;}
    const snap=await db.ref('/siswa').once('value');
    const val=snap.val()||{};
    const arr=Array.isArray(val)?val.filter(Boolean):Object.values(val).filter(Boolean);
    const found=arr.find(s=>s&&s.id===sid);
    if(!found){showErr('Siswa tidak ditemukan');return;}
    currentUser=found;currentRole='siswa';enterApp();return;
  }
  const uname=document.getElementById('inp-username').value.trim();
  const pass=document.getElementById('inp-password').value;
  if(!uname||!pass){showErr('Isi username dan password');return;}
  if(loginRole==='admin'){
    if(uname==='admin'&&pass==='admin123'){currentUser={username:'admin',nama:'Administrator',role:'admin'};currentRole='admin';enterApp();return;}
    const snap=await db.ref('/users').once('value');
    const val=snap.val()||{};const arr=Array.isArray(val)?val.filter(Boolean):Object.values(val).filter(Boolean);
    const found=arr.find(u=>u&&u.role==='admin'&&u.username===uname&&u.password===pass);
    if(!found){showErr('Username atau password salah');return;}
    currentUser=found;currentRole='admin';enterApp();return;
  }
  if(loginRole==='guru'){
    const snap=await db.ref('/users').once('value');
    const val=snap.val()||{};const arr=Array.isArray(val)?val.filter(Boolean):Object.values(val).filter(Boolean);
    const found=arr.find(u=>u&&u.role==='guru'&&u.username===uname&&u.password===pass);
    if(!found){showErr('Username atau password salah');return;}
    currentUser=found;currentRole='guru';enterApp();return;
  }
}
function enterApp(){
  document.getElementById('login-screen').classList.add('hide');
  document.getElementById('app').classList.add('show');
  setupSidebar();setupBottomNav();updateUserInfo();
  navigateTo(currentRole==='admin'?'dashboard':currentRole==='guru'?'nilai-guru':'nilai-siswa');
  loadAllData();
}
function doLogout(){
  ['users','mapel','siswa','nilai'].forEach(r=>db.ref('/'+r).off());
  currentUser=null;currentRole=null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hide');
  document.getElementById('inp-username').value='';
  document.getElementById('inp-password').value='';
  setLoginRole('admin');
}

// ═══ DATA ═══
function loadAllData(){
  db.ref('/users').on('value',s=>{const v=s.val()||{};allUsers=Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean);});
  db.ref('/mapel').on('value',s=>{const v=s.val()||{};allMapel=Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean);});
  db.ref('/siswa').on('value',s=>{
    const v=s.val()||{};allSiswa=Array.isArray(v)?v.filter(Boolean):Object.values(v).filter(Boolean);
    if(['data-siswa','dashboard','nilai-kelulusan','legger','nilai-guru','nilai-siswa'].includes(activeMenu))navigateTo(activeMenu);
  });
  db.ref('/nilai').on('value',s=>{
    allNilai=s.val()||{};
    if(['nilai-guru','legger','nilai-kelulusan','nilai-siswa','dashboard'].includes(activeMenu))navigateTo(activeMenu);
  });
}

// ═══ MENUS ═══
const MENUS={
  admin:[
    {id:'dashboard',label:'Dashboard',icon:()=>iDash(),section:'Menu Utama'},
    {id:'data-siswa',label:'Data Siswa',icon:()=>iSiswa()},
    {id:'mapel',label:'Mata Pelajaran',icon:()=>iMapel()},
    {id:'data-guru',label:'Data Guru',icon:()=>iGuru()},
    {id:'nilai-kelulusan',label:'Nilai Kelulusan',icon:()=>iNilai(),section:'Akademik'},
    {id:'legger',label:'Legger Nilai',icon:()=>iLegger()},
    {id:'pengaturan',label:'Pengaturan',icon:()=>iSetting(),section:'Sistem'},
  ],
  guru:[{id:'nilai-guru',label:'Input Nilai',icon:()=>iNilai(),section:'Guru'}],
  siswa:[
    {id:'nilai-siswa',label:'Input Nilai',icon:()=>iNilai(),section:'Siswa'},
  ]
};
function setupSidebar(){
  document.getElementById('sidebar-nav').innerHTML=(MENUS[currentRole]||[]).map(m=>
    `${m.section?`<div class="nav-section">${m.section}</div>`:''}
     <div class="nav-item" id="nav-${m.id}" onclick="navigateTo('${m.id}')">${m.icon()}<span>${m.label}</span></div>`
  ).join('');
}
function setupBottomNav(){
  document.getElementById('bottom-nav-items').innerHTML=(MENUS[currentRole]||[]).slice(0,5).map(m=>
    `<div class="bnav-item" id="bnav-${m.id}" onclick="navigateTo('${m.id}')">${m.icon()}<span>${m.label}</span></div>`
  ).join('');
}
function updateUserInfo(){
  const name=currentUser?.nama||currentUser?.username||'Pengguna';
  document.getElementById('user-name').textContent=name;
  document.getElementById('user-role').textContent=currentRole;
  document.getElementById('user-avatar').textContent=name.charAt(0).toUpperCase();
}
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const collapsed=sb.classList.toggle('collapsed');
  if(window.innerWidth>768)document.getElementById('main').classList.toggle('expanded',collapsed);
  else document.getElementById('sidebar-overlay').style.display=collapsed?'none':'block';
}
function closeSidebar(){
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebar-overlay').style.display='none';
}
window.addEventListener('resize',()=>{
  if(window.innerWidth>768){
    document.getElementById('sidebar-overlay').style.display='none';
    document.getElementById('sidebar').classList.remove('collapsed');
    document.getElementById('main').classList.remove('expanded');
  }
});
if(window.innerWidth<=768)document.getElementById('sidebar').classList.add('collapsed');

// ═══ NAVIGATE ═══
function navigateTo(id){
  activeMenu=id;
  document.querySelectorAll('.nav-item,.bnav-item').forEach(el=>el.classList.remove('active'));
  ['nav-','bnav-'].forEach(p=>{const el=document.getElementById(p+id);if(el)el.classList.add('active');});
  const m=(MENUS[currentRole]||[]).find(x=>x.id===id);
  document.getElementById('page-title').textContent=m?.label||id;
  if(window.innerWidth<=768)closeSidebar();
  const fn={
    'dashboard':renderDashboard,'data-siswa':renderDataSiswa,'mapel':renderMapel,
    'data-guru':renderDataGuru,'nilai-kelulusan':renderNilaiKelulusan,'legger':renderLegger,
    'pengaturan':renderPengaturan,'nilai-guru':renderNilaiGuru,
    'nilai-siswa':renderNilaiSiswa,
  }[id];
  if(fn)fn();
}

// ═══ HELPERS ═══
function v(id){return document.getElementById(id)?.value?.trim()||'';}
function toast(msg,type='success'){
  const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;
  document.getElementById('toast-container').appendChild(el);setTimeout(()=>el.remove(),3000);
}
function showModal(title,body,buttons=[]){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-footer').innerHTML=buttons.map(b=>`<button class="btn ${b.cls}" onclick="${b.action}">${b.label}</button>`).join('');
  document.getElementById('modal-bg').classList.remove('hide');
}
function closeModal(){document.getElementById('modal-bg').classList.add('hide');}
document.getElementById('modal-bg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

// ═══ FORMULA NILAI ═══
// isUs4Mapel: true hanya untuk BI, BIng, MTK, IPA
function hitungNilaiAkhir(d,isUs4Mapel=true){
  if(!d)return 0;
  const rv=['s1','s2','s3','s4','s5'].map(f=>d[f]).filter(x=>x!==undefined&&x!==null&&x!=='');
  const kompFields=['usMapel',...(isUs4Mapel?['us4Mapel']:[]),'praktik'];
  const kv=kompFields.map(f=>d[f]).filter(x=>x!==undefined&&x!==null&&x!=='');
  if(!rv.length&&!kv.length)return 0;
  const rr=rv.length?rv.reduce((a,b)=>a+parseFloat(b),0)/rv.length:0;
  const rk=kv.length?kv.reduce((a,b)=>a+parseFloat(b),0)/kv.length:0;
  if(rv.length&&kv.length)return rr*0.6+rk*0.4;
  if(rv.length)return rr;
  return rk;
}

// ═══ DASHBOARD ═══

// ── TEMPLATE & IMPORT EXCEL SISWA ──
function downloadTemplateSiswa(){
  const XLSX=window.XLSX;
  if(!XLSX){toast('Memuat library Excel...','info');return;}
  const ws=XLSX.utils.aoa_to_sheet([
    ['NIS','NISN','Nama Lengkap','Tempat Lahir','Tanggal Lahir (YYYY-MM-DD)','Jenis Kelamin (L/P)','Kelas (IX-1/IX-2/IX-3)','Nama Orang Tua'],
    ['12301','3123456789','Ahmad Fauzan','Bogor','2009-03-15','L','IX-1','Bapak Fauzan'],
    ['12302','3123456790','Siti Rahmah','Jakarta','2009-07-20','P','IX-2','Ibu Rahma'],
  ]);
  // lebar kolom
  ws['!cols']=[{wch:10},{wch:14},{wch:24},{wch:14},{wch:22},{wch:20},{wch:22},{wch:20}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Data Siswa');
  XLSX.writeFile(wb,'template_siswa_sinilai.xlsx');
  toast('Template Excel diunduh ✓');
}
function importSiswaExcel(inp){
  const file=inp.files[0];if(!file)return;
  const XLSX=window.XLSX;
  if(!XLSX){toast('Library Excel belum siap','error');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){toast('File Excel kosong','error');return;}
      let count=0;
      const promises=rows.slice(1).map(r=>{
        const nama=(r[2]||'').toString().trim();
        if(!nama)return Promise.resolve();
        const id='siswa_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
        // Tanggal: bisa angka serial Excel atau string
        let tgl=r[4]||'';
        if(typeof tgl==='number'){
          // Excel serial date → JS date
          const d=new Date(Math.round((tgl-25569)*86400*1000));
          tgl=d.toISOString().slice(0,10);
        } else {
          tgl=tgl.toString().trim();
        }
        const data={id,nis:(r[0]||'').toString().trim(),nisn:(r[1]||'').toString().trim(),
          nama,tempatLahir:(r[3]||'').toString().trim(),tanggalLahir:tgl,
          jk:(r[5]||'L').toString().trim()||'L',kelas:(r[6]||'IX-1').toString().trim()||'IX-1',
          namaOrtu:(r[7]||'').toString().trim()};
        count++;
        return db.ref('/siswa/'+id).set(data);
      });
      Promise.all(promises).then(()=>{toast(`${count} siswa berhasil diimport ✓`);inp.value='';});
    }catch(err){toast('Gagal membaca file Excel','error');console.error(err);}
  };
  reader.readAsBinaryString(file);
}

  if(konfirm2!=='HAPUS SEMUA'){toast('Penghapusan dibatalkan','info');return;}

}

// ── TEMPLATE & IMPORT EXCEL GURU ──
function downloadTemplateGuru(){
  const XLSX=window.XLSX;
  if(!XLSX){toast('Memuat library Excel...','info');return;}
  // Baris mapel untuk referensi
  const mapelRef=allMapel.length>0
    ?allMapel.map(m=>m.nama).join(', ')
    :'(belum ada mapel — isi nama mapel sesuai yang ada di sistem)';
  const ws=XLSX.utils.aoa_to_sheet([
    ['Nama Lengkap','Username','Password','Mata Pelajaran Diampu (pisah koma)'],
    ['Ahmad Guru','aguru','pass123','Matematika, Bahasa Indonesia'],
    ['Siti Pengajar','spengajar','pass456','Bahasa Inggris'],
    ['','','',''],
    ['--- REFERENSI MAPEL TERSEDIA ---','','',''],
    [mapelRef,'','',''],
  ]);
  ws['!cols']=[{wch:26},{wch:16},{wch:14},{wch:50}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Data Guru');
  XLSX.writeFile(wb,'template_guru_sinilai.xlsx');
  toast('Template Excel Guru diunduh ✓');
}
function importGuruExcel(inp){
  const file=inp.files[0];if(!file)return;
  const XLSX=window.XLSX;
  if(!XLSX){toast('Library Excel belum siap','error');return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){toast('File Excel kosong','error');return;}
      let count=0;
      const promises=rows.slice(1).map(r=>{
        const nama=(r[0]||'').toString().trim();
        const uname=(r[1]||'').toString().trim();
        const pass=(r[2]||'').toString().trim();
        if(!nama||!uname||!pass)return Promise.resolve();
        // Cocokkan nama mapel ke mapelIds
        const mapelNamaList=(r[3]||'').toString().split(',').map(x=>x.trim()).filter(Boolean);
        const mapelIds=mapelNamaList.map(mn=>{
          const found=allMapel.find(m=>m.nama.toLowerCase()===mn.toLowerCase());
          return found?found.id:null;
        }).filter(Boolean);
        const id='guru_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
        count++;
        return db.ref('/users/'+id).set({id,nama,username:uname,password:pass,mapelIds,role:'guru'});
      });
      Promise.all(promises).then(()=>{toast(`${count} guru berhasil diimport ✓`);inp.value='';});
    }catch(err){toast('Gagal membaca file Excel','error');console.error(err);}
  };
  reader.readAsBinaryString(file);
}

function saveGuru(id){
  const nama=v('f-gn'),uname=v('f-gu'),pass=v('f-gp');
  if(!nama||!uname){toast('Nama dan username wajib','error');return;}
  const mapelIds=[...document.querySelectorAll('#modal-body input[type=checkbox]:checked')].map(e=>e.value);
  const key=id||'guru_'+Date.now();
  const data={id:key,nama,username:uname,mapelIds,role:'guru'};

function uploadFile(key,inp){

    db.ref('/pengaturan/'+key).set(b64).then(()=>{toast('Upload berhasil');applyPengaturan();renderPengaturan();});
  };r.readAsDataURL(file);
}

  const u={kepsek:v('f-kepsek'),nipKepsek:v('f-nip'),nomorSK:v('f-sk'),kota:v('f-kota'),tahunPelajaran:v('f-tp'),tanggalSKL:v('f-tgl-skl')};
  Object.assign(pengaturan,u);db.ref('/pengaturan').update(u).then(()=>toast('Info disimpan'));

function gantiPass(){
  const p=v('f-pb'),k=v('f-pk');
  if(!p){toast('Isi password baru','error');return;}if(p!==k){toast('Password tidak cocok','error');return;}
  const admin=allUsers.find(u=>u.role==='admin'&&u.username===currentUser.username);
  if(admin)db.ref('/users/'+admin.id+'/password').set(p).then(()=>toast('Password diubah'));
}

function saveND(siswaId,mapelId,field,val,naId,isUs4Mapel=true){
  const dbKey=`${siswaId}_${mapelId}`;
  clearTimeout(debounceTimers[dbKey+'_'+field]);
  debounceTimers[dbKey+'_'+field]=setTimeout(()=>{
    const num=val.trim()!==''?parseFloat(val):null;
    if(num!==null&&!isNaN(num))db.ref('/nilai/'+dbKey+'/'+field).set(num);
    else db.ref('/nilai/'+dbKey+'/'+field).remove();
    if(!allNilai[dbKey])allNilai[dbKey]={};
    if(num!==null&&!isNaN(num))allNilai[dbKey][field]=num;
    else delete allNilai[dbKey][field];
    const na=hitungNilaiAkhir(allNilai[dbKey],isUs4Mapel);
    const el=document.getElementById(naId);
    if(el)el.textContent=na?na.toFixed(window.innerWidth<=768?0:2):'-';
  },800);
}

  const mapelId=dbKey.split('_').slice(1).join('_');
  const indEl=document.getElementById('siswa-save-indicator-'+mapelId);
  if(indEl)indEl.innerHTML='<span style="color:var(--gold)">● Menyimpan...</span>';
  clearTimeout(debounceTimers['siswa_'+dbKey+'_'+field]);
  debounceTimers['siswa_'+dbKey+'_'+field]=setTimeout(()=>{
    const num=val.trim()!==''?parseFloat(val):null;
    if(num!==null&&!isNaN(num))db.ref('/nilai/'+dbKey+'/'+field).set(num);
    else db.ref('/nilai/'+dbKey+'/'+field).remove();
    if(!allNilai[dbKey])allNilai[dbKey]={};
    if(num!==null&&!isNaN(num))allNilai[dbKey][field]=num;
    else delete allNilai[dbKey][field];
    if(indEl)indEl.innerHTML='<span style="color:var(--em)">✓ Tersimpan</span>';
    setTimeout(()=>{if(indEl)indEl.innerHTML='';},2000);
  },800);
}
  const rk=kv.length?(kv.reduce((a,b)=>a+parseFloat(b),0)/kv.length).toFixed(2):'-';
  const na=hitungNilaiAkhir(d);
  row.cells[2].textContent=rr;row.cells[3].textContent=rk;
  row.cells[4].innerHTML=`<strong style="color:var(--em)">${na?na.toFixed(2):'-'}</strong>`;
}

// ═══════════════════════════════════════════════
// CETAK SKL — format sesuai template FORM_KETERANGAN_KELULUSAN_2026
// KOP SEKOLAH / SURAT KETERANGAN KELULUSAN / Nomor
// Paragraf dasar SK → Biodata → LULUS → Tabel nilai → Penutup → TTD kanan
// ═══════════════════════════════════════════════
function cetakSKL(siswaId){
  const s=allSiswa.find(x=>x.id===siswaId)||(currentRole==='siswa'?currentUser:null);
  if(!s){toast('Data siswa tidak ditemukan','error');return;}

  const kepsek=pengaturan.kepsek||'................................';
  const nip=pengaturan.nipKepsek||'';
  const nomorSK=pengaturan.nomorSK||'..............................';
  const kota=pengaturan.kota||'Kabupaten Bogor';
  const tp=pengaturan.tahunPelajaran||'2025/2026';
  const tglSKL=pengaturan.tanggalSKL||'2 Juni 2026';
  const nomorSKLKey='nomorSKL_'+siswaId;
  const nomorSKL=pengaturan[nomorSKLKey]||'';

  const tglLahir=s.tanggalLahir?new Date(s.tanggalLahir).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
  const ttl=`${s.tempatLahir||'-'}, ${tglLahir}`;

  let totalNA=0,cntNA=0;
  // Gunakan daftar mapel dari Firebase; jika kosong pakai mapel template dokumen asli
  let mapelList=allMapel.length>0?allMapel:[
    {id:'m1',nama:'Pendidikan Agama dan Budi Pekerti'},{id:'m2',nama:'Pendidikan Pancasila'},
    {id:'m3',nama:'Bahasa Indonesia'},{id:'m4',nama:'Matematika'},
    {id:'m5',nama:'Ilmu Pengetahuan Alam'},{id:'m6',nama:'Ilmu Pengetahuan Sosial'},
    {id:'m7',nama:'Bahasa Inggris'},{id:'m8',nama:'Pendidikan Jasmani Olahraga dan Kesehatan'},
    {id:'m9',nama:'Informatika'},{id:'m10',nama:'Seni dan Prakarya *'},
    {id:'m11',nama:'Muatan Lokal Bahasa Sunda'},{id:'m12',nama:'Muatan Lokal :'},
    {id:'m13',nama:'Muatan Lokal :'}
  ];

  const nilaiRows=mapelList.map((m,i)=>{
    const key=`${s.id}_${m.id}`;
    const na=hitungNilaiAkhir(allNilai[key]||{});
    if(na){totalNA+=na;cntNA++;}
    return`<tr><td>${i+1}</td><td>${m.nama}</td><td>${na?na.toFixed(0):''}</td></tr>`;
  }).join('');
  const rataAll=cntNA?(totalNA/cntNA).toFixed(2):'';

  document.getElementById('content').innerHTML=`
  <!-- Toolbar (no print) -->
  <div class="section-header no-print">
    <div class="section-title">SKL — ${s.nama}</div>
    <div class="section-actions">
      <button class="btn btn-outline" onclick="navigateTo(currentRole==='siswa'?'nilai-siswa':'nilai-kelulusan')">← Kembali</button>
      <button class="btn btn-gold" onclick="window.print()">${iPrint()} Cetak / Simpan PDF</button>
    </div>
  </div>

  <!-- Edit bar: Nomor SKL + Nomor SK (no print) -->
  <div class="skl-edit-bar no-print">
    <label>Nomor SKL :</label>
    <input id="inp-skl-nomor" value="${nomorSKL}" placeholder="421/SKL/MB/VI/2026/001"
      oninput="document.getElementById('skl-nomor-text').textContent=this.value||'...............................'"/>
    <button class="btn btn-gold btn-sm" onclick="simpanNomorSKL('${siswaId}')">Simpan SKL</button>
  </div>
  <div class="skl-edit-bar no-print" style="background:#e8f5ef;border-color:var(--em)">
    <label style="color:var(--em2)">Nomor SK :</label>
    <input id="inp-sk-nomor" value="${nomorSK}" placeholder="421/SK.68/MB/VI/2026"
      oninput="document.getElementById('skl-sk-text').textContent=this.value||'..............................'"/>
    <button class="btn btn-primary btn-sm" onclick="simpanNomorSK()">Simpan SK</button>
  </div>

  <!-- DOKUMEN SKL -->
  <div class="skl-doc" id="skl-doc">

    <!-- KOP: gambar jika ada, fallback teks -->
    ${pengaturan.kop
      ?`<div class="skl-kop-wrap"><img class="skl-kop-img" src="${pengaturan.kop}" alt="Kop Surat"/></div>`
      :`<div class="skl-kop-fallback">
          ${pengaturan.logo?`<img class="kop-logo-img" src="${pengaturan.logo}" alt="logo"/>`:'<div class="kop-logo-placeholder"></div>'}
          <div class="kop-center">
            <div class="kop-yayasan">Yayasan Majma'ul Bahrain</div>
            <div class="kop-sekolah">SMP Islam Terpadu Majma'ul Bahrain</div>
            <div class="kop-detail">NPSN: 20231079${pengaturan.alamat?' | '+pengaturan.alamat:''}</div>
          </div>
        </div>`}
    <hr class="skl-garis"/>

    <!-- JUDUL -->
    <div class="skl-judul">SURAT KETERANGAN KELULUSAN</div>

    <!-- NOMOR SKL -->
    <div class="skl-nomor">Nomor : <span id="skl-nomor-text">${nomorSKL||'...............................'}</span></div>

    <!-- PARAGRAF DASAR — nomor SK bisa diedit inline -->
    <p class="skl-paragraf">Berdasarkan Surat Keputusan Kepala Sekolah Nomor <span id="skl-sk-text">${nomorSK}</span> tanggal ${tglSKL} tentang Penetapan Kelulusan Peserta Didik Tahun Pelajaran ${tp}, menerangkan bahwa:</p>

    <!-- BIODATA SISWA (indent, 3 baris) -->
    <table class="skl-biodata">
      <tr><td class="skl-bd-key">Nama Lengkap</td><td class="skl-bd-sep">:</td><td class="skl-bd-val"><strong>${s.nama}</strong></td></tr>
      <tr><td class="skl-bd-key">Tempat, Tanggal Lahir</td><td class="skl-bd-sep">:</td><td class="skl-bd-val">${ttl}</td></tr>
      <tr><td class="skl-bd-key">Nomor Induk Siswa Nasional</td><td class="skl-bd-sep">:</td><td class="skl-bd-val">${s.nisn||'-'}</td></tr>
    </table>

    <!-- LULUS -->
    <p class="skl-dinyatakan">Dinyatakan &nbsp;: &nbsp;<strong>LULUS</strong></p>
    <p class="skl-rincian">Dengan rincian nilai sebagai berikut</p>

    <!-- TABEL NILAI -->
    <table class="skl-tabel">
      <thead>
        <tr><th>No.</th><th>Mata Pelajaran</th><th>Nilai</th></tr>
      </thead>
      <tbody>${nilaiRows}</tbody>
      <tfoot>
        <tr><td colspan="2" style="text-align:center;font-weight:700">Rata - rata</td><td style="text-align:center;font-weight:700">${rataAll}</td></tr>
      </tfoot>
    </table>

    <!-- PENUTUP -->
    <p class="skl-penutup">Demikian surat keterangan ini dibuat, untuk dapat dipergunakan sebagaimana mestinya dan berlaku sampai diterbitkannya ijazah.</p>

    <!-- TANDA TANGAN — kanan bawah -->
    <div class="skl-ttd-row">
      <div class="skl-ttd-box">
        <p class="ttd-kota">${kota}, &nbsp; ${tglSKL}</p>
        <p class="ttd-jabatan">Kepala Sekolah SMP-IT Majma'ul Bahrain,</p>
        <div class="ttd-gap"></div>
        <p class="ttd-nama">Hj. Miya Fahmiyawati, S.Pd.I</p>
        <p class="ttd-nuks">NUKS : 19023L072020523210788</p>
        ${nip?`<p class="ttd-nip">NIP. ${nip}</p>`:''}
      </div>
    </div>

    <!-- CATATAN KAKI -->
    <div class="skl-catatan">
      <p>*) Susunan Kurikulum Merdeka</p>
    </div>

  </div>`;
}
function simpanNomorSKL(siswaId){
  const nomor=document.getElementById('inp-skl-nomor')?.value||'';
  const key='nomorSKL_'+siswaId;
  pengaturan[key]=nomor;
  db.ref('/pengaturan/'+key).set(nomor).then(()=>toast('Nomor SKL disimpan'));
}
function simpanNomorSK(){
  const nomor=document.getElementById('inp-sk-nomor')?.value||'';
  pengaturan.nomorSK=nomor;
  db.ref('/pengaturan/nomorSK').set(nomor).then(()=>toast('Nomor SK disimpan'));
}
