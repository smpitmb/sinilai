<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SiNilai — SMP-IT Majma'ul Bahrain</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--em:#1a6b4a;--em2:#145439;--em3:#0e3d2b;--em-light:#e8f5ef;--em-mid:#b2d9c6;--gold:#c9a84c;--gold2:#a8872e;--gold-light:#fdf6e3;--bg:#f4f7f5;--card:#fff;--border:#dce8e1;--text:#1a2e25;--text2:#4a6858;--text3:#8aab97;--radius:14px;--rsm:8px;--shadow:0 2px 12px rgba(26,107,74,.10);--shadow-lg:0 8px 32px rgba(26,107,74,.15);--sw:260px;--hh:64px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
/* LOADING */
#LS{position:fixed;inset:0;background:var(--em3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
#LS.out{opacity:0;transition:opacity .4s;pointer-events:none}
.ll{width:80px;height:80px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:pulse 1.8s infinite}
.ll svg{width:44px;height:44px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.5)}70%{box-shadow:0 0 0 20px rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}
.lt{color:#fff;font-size:28px;font-family:'Playfair Display',serif;margin-bottom:6px}
.ls{color:var(--em-mid);font-size:13px}
.lb{width:180px;height:3px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:28px;overflow:hidden}
.lf{height:100%;background:var(--gold);border-radius:3px;animation:lf 2s ease forwards}
@keyframes lf{from{width:0}to{width:100%}}
/* LOGIN */
#LG{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:var(--em3);background-size:cover;background-position:center}
#LG.hide{display:none!important}
.lo{position:absolute;inset:0;background:linear-gradient(135deg,rgba(14,61,43,.92),rgba(26,107,74,.80))}
.lb2{position:relative;background:#fff;border-radius:24px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.3);z-index:1}
.ll2{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.ll2i{width:52px;height:52px;border-radius:12px;background:var(--em);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.ll2i svg{width:28px;height:28px;fill:#fff}
.ll2i img{width:100%;height:100%;object-fit:cover;display:none}
.ll2t h2{font-size:22px;color:var(--em);font-family:'Playfair Display',serif}
.ll2t p{font-size:11px;color:var(--text3);margin-top:2px}
.rtabs{display:flex;gap:6px;margin-bottom:24px;background:var(--em-light);padding:5px;border-radius:var(--rsm)}
.rtab{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:.2s}
.rtab.on{background:var(--em);color:#fff}
.lerr{background:#fff0f0;border:1px solid #fca5a5;color:#dc2626;padding:10px 14px;border-radius:var(--rsm);font-size:13px;margin-bottom:14px;display:none}
.fi,.fs{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;font-family:inherit;background:#fff;color:var(--text);outline:none;transition:.2s;margin-top:6px}
.fi:focus,.fs:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(26,107,74,.1)}
.fg{margin-bottom:16px}
.fl{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;display:block}
.bsl{width:100%;padding:14px;background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;border:none;border-radius:var(--rsm);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px}
/* LAYOUT */
#APP{display:none}#APP.on{display:flex}
#SB{width:var(--sw);background:linear-gradient(180deg,var(--em3),var(--em2));min-height:100vh;display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:200;overflow:hidden;transition:transform .3s}
#SB.off{transform:translateX(-100%)}
.sbh{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sbb{display:flex;align-items:center;gap:12px}
.sbi{width:40px;height:40px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.sbi svg{width:22px;height:22px;fill:#fff}
.sbi img{width:100%;height:100%;object-fit:cover;display:none}
.sbn h3{color:#fff;font-size:17px;font-family:'Playfair Display',serif;white-space:nowrap}
.sbn p{color:rgba(255,255,255,.5);font-size:10px;white-space:nowrap}
.sbu{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.urow{display:flex;align-items:center;gap:10px}
.uav{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--em3);font-weight:700;font-size:14px;flex-shrink:0}
.unm{color:#fff;font-size:13px;font-weight:600}
.url{color:rgba(255,255,255,.5);font-size:11px;text-transform:capitalize}
.sbnav{flex:1;overflow-y:auto;padding:10px 0}
.nvsec{padding:8px 18px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase}
.nvi{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;color:rgba(255,255,255,.7);transition:.2s;border-left:3px solid transparent;font-size:14px;font-weight:500;white-space:nowrap}
.nvi:hover{background:rgba(255,255,255,.06);color:#fff}
.nvi.on{background:rgba(201,168,76,.15);color:var(--gold);border-left-color:var(--gold)}
.nvi svg{width:18px;height:18px;flex-shrink:0}
.sbf{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08)}
.blo{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--rsm);color:rgba(255,255,255,.7);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s}
.blo:hover{background:rgba(220,38,38,.2);color:#fca5a5}
#MN{flex:1;margin-left:var(--sw);display:flex;flex-direction:column;min-height:100vh;transition:margin .3s}
#MN.exp{margin-left:0}
#HD{height:var(--hh);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.btog{width:36px;height:36px;border-radius:8px;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:.2s;flex-shrink:0}
.btog:hover{background:var(--em-light);color:var(--em)}
.hdtit{flex:1;min-width:0}
.hdtit h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdtit p{font-size:11px;color:var(--text3)}
.bheadlo{display:flex;align-items:center;gap:6px;padding:8px 14px;background:#fee2e2;border:1.5px solid #fca5a5;border-radius:var(--rsm);color:#dc2626;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0}
.bheadlo:hover{background:#dc2626;color:#fff}
#CT{flex:1;padding:24px;overflow-y:auto}
/* OVERLAY */
#OV{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:199}
/* BOTTOM NAV */
#BN{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 0;z-index:150}
.bni{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;cursor:pointer;color:var(--text3);transition:.2s;min-width:56px}
.bni.on{color:var(--em)}
.bni svg{width:22px;height:22px}
.bni span{font-size:10px;font-weight:600}
.bnrow{display:flex;justify-content:space-around}
/* CARDS / TABLE */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.stat-icon{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:26px;height:26px}
.stat-info p{font-size:26px;font-weight:700;line-height:1}
.stat-info span{font-size:12px;color:var(--text3);margin-top:3px;display:block}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.stit{font-size:18px;font-weight:700}
.sact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.ts{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{background:var(--em-light);color:var(--em);font-weight:700;padding:11px 14px;text-align:left;border-bottom:2px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.dt td{padding:10px 14px;border-bottom:1px solid #f0f4f2;vertical-align:middle}
.dt tr:last-child td{border-bottom:none}
.dt tr:hover td{background:#fafcfb}
.acts{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--rsm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:none;white-space:nowrap;transition:.2s}
.btn svg{width:14px;height:14px;flex-shrink:0}
.bpr{background:var(--em);color:#fff}.bpr:hover{background:var(--em2)}
.bgo{background:var(--gold);color:#fff}.bgo:hover{background:var(--gold2)}
.bdn{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}.bdn:hover{background:#dc2626;color:#fff}
.bot{background:#fff;border:1.5px solid var(--border);color:var(--text2)}.bot:hover{border-color:var(--em);color:var(--em);background:var(--em-light)}
.bsm{padding:6px 11px;font-size:12px}
.bnicon{padding:7px}
.badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.bem{background:var(--em-light);color:var(--em)}
.bgl{background:var(--gold-light);color:var(--gold2)}
.kc{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--em-light);color:var(--em)}
/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.mbg.hide{display:none}
.mbox{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.mhdr{padding:22px 26px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mhdr h3{font-size:17px;font-weight:700}
.mcls{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--text3)}
.mcls:hover{background:#fee2e2;color:#dc2626}
.mbdy{padding:0 26px 20px}
.mftr{padding:0 26px 24px;display:flex;gap:10px;justify-content:flex-end}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fg{margin-bottom:16px}
.fl{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:5px}
.fi,.fs,.fta{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--rsm);font-size:14px;font-family:inherit;background:#fff;color:var(--text);outline:none;transition:.2s}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(26,107,74,.1)}
.cbgroup{display:flex;flex-wrap:wrap;gap:8px}
.cbi{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;transition:.2s}
.cbi:has(input:checked){border-color:var(--em);background:var(--em-light);color:var(--em)}
.cbi input{accent-color:var(--em)}
/* TOAST */
#TC{position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:tin .3s ease;max-width:300px}
.ts2{background:var(--em);color:#fff}.te{background:#dc2626;color:#fff}.ti{background:#3b82f6;color:#fff}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* PROGRESS */
.pb{height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex:1}
.pf{height:100%;background:var(--em);border-radius:3px;transition:.3s}
.prow{display:flex;align-items:center;gap:10px}
.pct{font-size:12px;color:var(--text3);white-space:nowrap}
/* SISWA CARDS */
.sc{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px}
.sch{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sca{width:44px;height:44px;border-radius:50%;background:var(--em-light);display:flex;align-items:center;justify-content:center;color:var(--em);font-weight:700;font-size:16px;flex-shrink:0}
.sci h4{font-size:15px;font-weight:700}
.sci p{font-size:12px;color:var(--text3);margin-top:2px}
/* NILAI INPUT */
.nitbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);background:#fff;width:100%;display:block}
.nitbl{border-collapse:collapse;font-size:12.5px;white-space:nowrap;width:max-content;min-width:100%}
.nitbl th{background:var(--em);color:#fff;padding:10px;text-align:center;font-size:11px;font-weight:700}
.nitbl th.stk0{position:sticky;left:0;z-index:6;background:var(--em);min-width:42px}
.nitbl th.stk1{position:sticky;left:42px;z-index:6;background:var(--em);min-width:150px}
.nitbl th.fin{background:var(--gold)}
.nitbl td{padding:8px 10px;border-bottom:1px solid #edf2ef;text-align:center;vertical-align:middle;background:#fff}
.nitbl td.stk0{position:sticky;left:0;z-index:3;background:#fff;min-width:42px;font-size:13px}
.nitbl td.stk1{position:sticky;left:42px;z-index:3;background:#fff;box-shadow:2px 0 4px rgba(0,0,0,.05);min-width:150px;max-width:150px;overflow:hidden;text-overflow:ellipsis;text-align:left;font-weight:600}
.nitbl tr:hover td{background:#f7fcf9}
.nitbl tr:hover td.stk0,.nitbl tr:hover td.stk1{background:#f0f8f3}
.nitbl td.fin{background:#fffdf5!important;font-weight:700;color:var(--em)}
.ni{width:58px;padding:5px 4px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:inherit;outline:none;transition:.2s;background:#fff}
.ni:focus{border-color:var(--em);box-shadow:0 0 0 2px rgba(26,107,74,.1)}
/* EXPAND PANEL */
.ep{background:var(--em-light);border-radius:var(--rsm);padding:14px;margin-top:10px;display:none}
.ep.on{display:block}
.epg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
/* SISWA INPUT */
.sic{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px}
.sic h3{font-size:15px;font-weight:700;color:var(--em);margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.semgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.sembox{background:var(--bg);border:2px solid var(--border);border-radius:var(--rsm);padding:12px 8px;text-align:center;transition:.2s}
.sembox:focus-within{border-color:var(--em);background:var(--em-light)}
.sembox label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;display:block;margin-bottom:8px;cursor:default}
.sembox input{width:100%;text-align:center;font-size:24px;font-weight:700;border:none;outline:none;background:transparent;color:var(--em);font-family:inherit;display:block}
/* LEGGER */
.ltbl{border-collapse:collapse;font-size:11px}
.ltbl th,.ltbl td{border:1px solid #ccc;padding:5px 8px;white-space:nowrap}
.ltbl th{background:var(--em);color:#fff;text-align:center;font-weight:700}
.ltbl td{text-align:center}
.ltbl tr:nth-child(even) td{background:#f9fafb}
.ltbl .cn{text-align:left;font-weight:600}
/* SKL */
@media print{#SB,#HD,#TC,.nopr,#BN{display:none!important}#MN{margin:0!important}#CT{padding:0!important}body{background:#fff}.skldoc{box-shadow:none!important;border-radius:0!important;padding:15mm 20mm 20mm 25mm!important;max-width:none!important}}
.skldoc{background:#fff;padding:24px 50px 36px;font-family:'Times New Roman',Times,serif;font-size:12pt;line-height:1.6;box-shadow:var(--shadow-lg);border-radius:var(--radius);max-width:794px;margin:0 auto}
.skl-kw{margin-bottom:0}.skl-ki{width:100%;display:block}
.skl-kf{display:flex;align-items:center;gap:16px;padding-bottom:10px}
.skl-kli{width:80px;height:80px;object-fit:contain;flex-shrink:0}
.skl-kc{flex:1;text-align:center}
.skl-ky{font-size:13pt;font-weight:700;text-transform:uppercase}
.skl-ks{font-size:16pt;font-weight:700;text-transform:uppercase;margin:2px 0}
.skl-kd{font-size:10pt}
.skl-gr{border:none;border-top:4px double #000;margin:6px 0 16px}
.skl-jd{text-align:center;font-size:14pt;font-weight:700;text-transform:uppercase;text-decoration:underline;letter-spacing:1px;margin:14px 0 4px}
.skl-nm{text-align:center;font-size:11pt;margin-bottom:20px}
.skl-pg{text-indent:72px;text-align:justify;margin:0 0 8px;font-size:12pt}
.skl-bd{border-collapse:collapse;margin:8px 0 8px 100px;font-size:12pt}
.skl-bdk{width:220px;padding:2px 0}
.skl-bds{width:14px;text-align:center;padding:2px 4px}
.skl-bdv{padding:2px 0}
.skl-ly{text-indent:72px;font-size:12pt;margin:12px 0 4px}
.skl-ri{text-indent:72px;font-size:12pt;margin:0 0 8px}
.skl-tb{width:100%;border-collapse:collapse;margin:4px 0 16px;font-size:11pt}
.skl-tb th,.skl-tb td{border:1px solid #000;padding:4px 10px}
.skl-tb thead th{background:#f0f0f0;text-align:center;font-weight:700}
.skl-tb tbody td:first-child{text-align:center;width:44px}
.skl-tb tbody td:last-child{text-align:center;width:80px}
.skl-tb tfoot td{font-weight:700;background:#f5f5f5;text-align:center}
.skl-pe{text-align:justify;font-size:12pt;margin:4px 0 6px}
.skl-tr{display:flex;justify-content:flex-end;margin-top:24px}
.skl-tb2{text-align:center;min-width:220px}
.ttdk{margin:0;font-size:12pt}.ttdj{margin:2px 0 0;font-size:12pt}.ttdg{height:68px;display:block}.ttdn{margin:0;font-size:12pt;font-weight:700;text-decoration:underline}.ttdu{margin:1px 0 0;font-size:10.5pt}.ttdp{margin:2px 0 0;font-size:11pt}
.skl-ct{margin-top:18px;font-size:9.5pt;font-style:italic}
.skl-eb{background:var(--gold-light);border:1.5px solid var(--gold);border-radius:var(--rsm);padding:12px 16px;font-size:13px;display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.skl-eb label{font-weight:700;color:var(--gold2);white-space:nowrap}
.skl-eb input{flex:1;min-width:200px;padding:7px 12px;border:1.5px solid var(--gold);border-radius:6px;font-size:13px;font-family:inherit;outline:none}
/* PENGATURAN */
.pgcard{background:#fff;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:18px}
.pgcard h3{font-size:14px;font-weight:700;color:var(--em);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.upzone{border:2px dashed var(--border);border-radius:var(--rsm);padding:20px;text-align:center;cursor:pointer;transition:.2s}
.upzone:hover{border-color:var(--em);background:var(--em-light)}
.upzone img{max-height:80px;max-width:200px;object-fit:contain;margin-bottom:8px}
.upzone p{font-size:12px;color:var(--text3)}
/* MAPEL TABS */
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

// ══════════════════════════════════════

function initFirebase(){
  try{
    var cfg={
      apiKey:"AIzaSyBiv-YC0KLaq6ecCc6gSlgGhdbnxulSt6c",
      databaseURL:"https://sinilai-majmaulbahrain-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:"sinilai-majmaulbahrain"
    };
    if(typeof firebase==='undefined'){console.warn('Firebase SDK belum dimuat');return;}
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    DB=firebase.database();
    console.log('Firebase OK');
    loadPeng();
  }catch(e){console.warn('Firebase error:',e);}
}

function dbr(path){if(!DB)return null;try{return DB.ref(path);}catch(e){return null;}}
function dbs(path,val){var r=dbr(path);if(r)r.set(val);}
function dbup(path,val){var r=dbr(path);if(r)r.update(val);}
function dbrm(path){var r=dbr(path);if(r)r.remove();}
function dbon(path,cb){var r=dbr(path);if(r)r.on('value',cb);}
function dbonce(path,cb){var r=dbr(path);if(r)r.once('value',cb,function(){cb({val:function(){return null;}});});else cb({val:function(){return null;}});}

function loadPeng(){
  dbonce('/pengaturan',function(s){
    peng=s.val()||{};
    applyPeng();
  });
}
function applyPeng(){
  if(peng.logo){
    var imgs=['logoImg','sbLogoImg'];
    imgs.forEach(function(id){var el=document.getElementById(id);if(el){el.src=peng.logo;el.style.display='block';}});
  }
  if(peng.fotoLatar) document.getElementById('LG').style.backgroundImage='url('+peng.fotoLatar+')';
}

// ══════════════════════════════════════
// LOGIN
// ══════════════════════════════════════
function setRole(r){
  loginRole=r;
  document.querySelectorAll('.rtab').forEach(function(t,i){t.classList.toggle('on',['admin','guru','siswa'][i]===r);});
  document.getElementById('fuser').style.display=r!=='siswa'?'block':'none';
  document.getElementById('fsis').style.display=r==='siswa'?'block':'none';
  document.getElementById('lerr').style.display='none';
}
function showErr(m){var e=document.getElementById('lerr');e.textContent=m;e.style.display='block';}

function loadSiswaDrp(){
  var kelas=document.getElementById('sklkls').value;
  var sel=document.getElementById('sklnm');
  sel.innerHTML='<option value="">-- Pilih Nama --</option>';
  if(!kelas)return;
  dbonce('/siswa',function(s){
    var val=s.val()||{};
    var arr=Array.isArray(val)?val.filter(Boolean):Object.values(val).filter(Boolean);
    arr.filter(function(x){return x&&x.kelas===kelas;})
      .sort(function(a,b){return a.nama.localeCompare(b.nama);})
      .forEach(function(x){var o=document.createElement('option');o.value=x.id;o.textContent=x.nama;sel.appendChild(o);});
  });
}

function doLogin(){
  document.getElementById('lerr').style.display='none';
  if(loginRole==='siswa'){
    var kelas=document.getElementById('sklkls').value;
    var sid=document.getElementById('sklnm').value;
    if(!kelas||!sid){showErr('Pilih kelas dan nama');return;}
    dbonce('/siswa',function(s){
      var arr=toArr(s.val());
      var found=arr.find(function(x){return x&&x.id===sid;});
      if(!found){showErr('Siswa tidak ditemukan');return;}
      curUser=found;curRole='siswa';enterApp();
    });
    return;
  }
  var un=document.getElementById('iun').value.trim();
  var pw=document.getElementById('ipw').value;
  if(!un||!pw){showErr('Isi username dan password');return;}
  if(loginRole==='admin'){
    if(un==='admin'&&pw==='admin123'){curUser={username:'admin',nama:'Administrator',role:'admin'};curRole='admin';enterApp();return;}
    dbonce('/users',function(s){
      var found=toArr(s.val()).find(function(u){return u&&u.role==='admin'&&u.username===un&&u.password===pw;});
      if(!found){showErr('Username atau password salah');return;}
      curUser=found;curRole='admin';enterApp();
    });
    return;
  }
  if(loginRole==='guru'){
    dbonce('/users',function(s){
      var found=toArr(s.val()).find(function(u){return u&&u.role==='guru'&&u.username===un&&u.password===pw;});
      if(!found){showErr('Username atau password salah');return;}
      curUser=found;curRole='guru';enterApp();
    });
  }
}

function enterApp(){
  document.getElementById('LG').classList.add('hide');
  document.getElementById('APP').style.display='flex';
  setupSB();setupBN();updateUI();
  go(curRole==='admin'?'dashboard':curRole==='guru'?'nilai-guru':'nilai-siswa');
  loadData();
}

function doLogout(){
  if(DB){['users','mapel','siswa','nilai'].forEach(function(r){var ref=dbr('/'+r);if(ref)ref.off();});}
  curUser=null;curRole=null;
  document.getElementById('APP').style.display='none';
  document.getElementById('LG').classList.remove('hide');
  document.getElementById('iun').value='';
  document.getElementById('ipw').value='';
  setRole('admin');
}

    allNilai=s.val()||{};
    if(['nilai-guru','legger','nilai-kelulusan','nilai-siswa','dashboard'].indexOf(activeMenu)>=0) go(activeMenu);
  });
}

// ══════════════════════════════════════
// FORMULA NILAI
// ══════════════════════════════════════
function hitNA(d,u4){
  if(!d) return 0;
  var rv=['s1','s2','s3','s4','s5'].map(function(f){return d[f];}).filter(function(x){return x!==undefined&&x!==null&&x!=='';});
  var kf=['usMapel'].concat(u4?['us4Mapel']:[]).concat(['praktik']);
  var kv=kf.map(function(f){return d[f];}).filter(function(x){return x!==undefined&&x!==null&&x!=='';});
  if(!rv.length&&!kv.length) return 0;
  var rr=rv.length?rv.reduce(function(a,b){return a+parseFloat(b);},0)/rv.length:0;
  var rk=kv.length?kv.reduce(function(a,b){return a+parseFloat(b);},0)/kv.length:0;
  if(rv.length&&kv.length) return rr*0.6+rk*0.4;
  return rv.length?rr:rk;
}
function isU4(mapelId){
  var nm=(allMapel.find(function(m){return m.id===mapelId;})||{}).nama||'';
  return /bahasa indonesia|bahasa inggris|matematika|ilmu pengetahuan alam|\bipa\b/i.test(nm);
}

function saveSiswa(id){
  var d={nis:gv('fnis'),nisn:gv('fnisn'),nama:gv('fnama'),tempatLahir:gv('fttl'),tanggalLahir:gv('ftgl'),jk:gv('fjk'),kelas:gv('fkls2'),namaOrtu:gv('fortu')};
  if(!d.nama){toast('Nama wajib diisi','error');return;}
  var key=id||('siswa_'+Date.now());d.id=key;

function hapusSiswa(id){if(!confirm('Hapus siswa ini?'))return;dbrm('/siswa/'+id);toast('Siswa dihapus');}
function hapusAllSiswa(){
  if(!confirm('PERINGATAN!\nHapus SEMUA '+allSiswa.length+' siswa?\nTidak dapat dibatalkan!')) return;
  var k=prompt('Ketik HAPUS SEMUA untuk konfirmasi:');
  if(k!=='HAPUS SEMUA'){toast('Dibatalkan','info');return;}
  dbrm('/siswa');toast('Semua siswa dihapus');
}
function dlTplSiswa(){
  if(!window.XLSX){toast('Library Excel belum siap','error');return;}
  var ws=XLSX.utils.aoa_to_sheet([
    ['NIS','NISN','Nama Lengkap','Tempat Lahir','Tanggal Lahir (YYYY-MM-DD)','JK (L/P)','Kelas (IX-1/IX-2/IX-3)','Nama Orang Tua'],
    ['12301','3123456789','Ahmad Fauzan','Bogor','2009-03-15','L','IX-1','Bapak Fauzan'],
    ['12302','3123456790','Siti Rahmah','Jakarta','2009-07-20','P','IX-2','Ibu Rahma'],
  ]);
  ws['!cols']=[{wch:10},{wch:14},{wch:24},{wch:14},{wch:22},{wch:10},{wch:20},{wch:20}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Siswa');
  XLSX.writeFile(wb,'template_siswa.xlsx');toast('Template diunduh');
}
function impSiswa(inp){
  var file=inp.files[0];if(!file)return;
  if(!window.XLSX){toast('Library Excel belum siap','error');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var wb=XLSX.read(e.target.result,{type:'binary'});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      var cnt=0;
      rows.slice(1).forEach(function(r){
        var nm=(r[2]||'').toString().trim();if(!nm)return;
        var id='siswa_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);
        var tgl=r[4]||'';
        if(typeof tgl==='number'){var d=new Date(Math.round((tgl-25569)*86400*1000));tgl=d.toISOString().slice(0,10);}
        dbs('/siswa/'+id,{id:id,nis:(r[0]||'').toString().trim(),nisn:(r[1]||'').toString().trim(),nama:nm,tempatLahir:(r[3]||'').toString().trim(),tanggalLahir:tgl.toString().trim(),jk:(r[5]||'L').toString().trim()||'L',kelas:(r[6]||'IX-1').toString().trim()||'IX-1',namaOrtu:(r[7]||'').toString().trim()});
        cnt++;
      });
      toast(cnt+' siswa diimport');inp.value='';
    }catch(err){toast('Gagal baca Excel','error');}
  };
  reader.readAsBinaryString(file);
}

    '<div class="shdr"><div class="stit">Nilai Kelulusan</div><div class="sact">'+
    '<select class="fs" id="fnk" style="width:100px;padding:8px" onchange="rNilaiKel()"><option value="">Semua</option><option>IX-1</option><option>IX-2</option><option>IX-3</option></select>'+
    '</div></div>'+
    '<div class="tw dt-wrap"><div class="ts"><table class="dt"><thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Progress Nilai</th><th>Nilai Akhir</th><th>Aksi</th></tr></thead><tbody id="tnk"></tbody></table></div></div>'+
    '<div class="cv" id="cnk"></div>';
  var kf=gv('fnk')||'';
  var list=allSiswa.filter(function(s){return!kf||s.kelas===kf;});
  var rows=list.map(function(s,i){
    var fill=0,tot=0,cnt=0;
    allMapel.forEach(function(m){var k=s.id+'_'+m.id;if(allNilai[k]){fill++;var na=hitNA(allNilai[k],isU4(m.id));tot+=na;cnt++;}});
    var pct=allMapel.length?Math.round(fill/allMapel.length*100):0;
    var avg=cnt?(tot/cnt).toFixed(2):'-';
    return {s:s,fill:fill,pct:pct,avg:avg,i:i};
  });
  var tb=document.getElementById('tnk');
  if(tb) tb.innerHTML=rows.map(function(r){return '<tr><td>'+(r.i+1)+'</td><td>'+(r.s.nis||'-')+'</td><td><strong>'+r.s.nama+'</strong></td><td><span class="kc">'+r.s.kelas+'</span></td><td><div class="prow"><div class="pb"><div class="pf" style="width:'+r.pct+'%"></div></div><span class="pct">'+r.fill+'/'+allMapel.length+'</span></div></td><td><strong style="color:var(--em)">'+r.avg+'</strong></td><td><button class="btn bgo bsm" onclick="rSKL(\''+r.s.id+'\')">'+iPrint+' SKL</button></td></tr>';}).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:20px">Belum ada data</td></tr>';
  var cv=document.getElementById('cnk');
  if(cv) cv.innerHTML=rows.map(function(r){return '<div class="sc"><div class="sch"><div class="sca">'+r.s.nama.charAt(0)+'</div><div class="sci"><h4>'+r.s.nama+'</h4><p>'+(r.s.nis||'-')+' · '+r.s.kelas+'</p></div></div><div class="prow" style="margin-bottom:8px"><div class="pb"><div class="pf" style="width:'+r.pct+'%"></div></div><span class="pct">'+r.fill+'/'+allMapel.length+'</span></div><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:var(--text3)">Nilai Akhir: <strong style="color:var(--em)">'+r.avg+'</strong></span><button class="btn bgo bsm" onclick="rSKL(\''+r.s.id+'\')">'+iPrint+' SKL</button></div></div>';}).join('');
}

function upFile(key,inp){
  var file=inp.files[0];if(!file)return;
  if(file.size>600000){toast('File terlalu besar (maks 600KB)','error');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    peng[key]=e.target.result;
    dbs('/pengaturan/'+key,e.target.result);
    toast('Upload berhasil');applyPeng();rPengaturan();
  };
  reader.readAsDataURL(file);
}
function simpanInfoSekolah(){
  var u={kota:gv('pkota'),tanggalSKL:gv('ptgl'),tahunPelajaran:gv('ptp'),alamat:gv('palamat')};
  Object.assign(peng,u);dbup('/pengaturan',u);toast('Informasi disimpan');
}
function gantiPass(){
  var pb=gv('ppb'),pk=gv('ppk');
  if(!pb){toast('Isi password baru','error');return;}
  if(pb!==pk){toast('Password tidak cocok','error');return;}
  var admin=allUsers.find(function(u){return u.role==='admin'&&u.username===curUser.username;});
  if(admin) dbs('/users/'+admin.id+'/password',pb);
  toast('Password berhasil diubah');
}

        '</div>'+

        '</div></div></div>';
    }).join('');
    return;
  }
  // DESKTOP
  area.innerHTML='<div class="nitbl-wrap"><table class="nitbl"><thead><tr>'+
    '<th class="stk0">No</th><th class="stk1">Nama Siswa</th>'+

        '<td class="fin"><span id="nd-'+s.id+'">'+(na?na.toFixed(2):'-')+'</span></td></tr>';
    }).join('')+
    '</tbody></table></div>';
}
function togEP(id){var el=document.getElementById(id);if(el)el.classList.toggle('on');}
function svN(sid,mid,field,val,naId,u4){
  var k=sid+'_'+mid;
  clearTimeout(dbt[k+'_'+field]);
  dbt[k+'_'+field]=setTimeout(function(){
    var num=val.trim()!==''?parseFloat(val):null;
    if(num!==null&&!isNaN(num)) dbs('/nilai/'+k+'/'+field,num);
    else dbrm('/nilai/'+k+'/'+field);
    if(!allNilai[k]) allNilai[k]={};
    if(num!==null&&!isNaN(num)) allNilai[k][field]=num;
    else delete allNilai[k][field];
    var na=hitNA(allNilai[k],u4);
    var el=document.getElementById(naId);
    if(el) el.textContent=na?na.toFixed(window.innerWidth<=768?0:2):'-';
  },800);
}
