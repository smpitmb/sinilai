<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SiNilai — SMP-IT Majma'ul Bahrain</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
:root{
  --em:#1a6b4a;--em2:#145439;--em3:#0e3d2b;--em-light:#e8f5ef;--em-mid:#b2d9c6;
  --gold:#c9a84c;--gold2:#a8872e;--gold-light:#fdf6e3;
  --bg:#f4f7f5;--card:#fff;--border:#dce8e1;
  --text:#1a2e25;--text2:#4a6858;--text3:#8aab97;
  --radius:14px;--radius-sm:8px;--shadow:0 2px 12px rgba(26,107,74,.10);--shadow-lg:0 8px 32px rgba(26,107,74,.15);
  --sidebar-w:260px;--header-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.display{font-family:'Playfair Display',serif}

/* ── LOADING ── */
#loading-screen{position:fixed;inset:0;background:var(--em3);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#loading-screen.hide{opacity:0;pointer-events:none}
.loader-logo{width:80px;height:80px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:24px;box-shadow:0 0 0 0 rgba(201,168,76,.4);animation:pulse 1.8s infinite}
.loader-logo svg{width:44px;height:44px;fill:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,168,76,.5)}70%{box-shadow:0 0 0 20px rgba(201,168,76,0)}100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}}
.loader-title{color:#fff;font-size:28px;font-family:'Playfair Display',serif;margin-bottom:6px}
.loader-sub{color:var(--em-mid);font-size:13px;letter-spacing:.5px}
.loader-bar{width:180px;height:3px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:28px;overflow:hidden}
.loader-fill{height:100%;background:var(--gold);border-radius:4px;animation:fill 2s ease forwards}
@keyframes fill{from{width:0}to{width:100%}}

/* ── LOGIN ── */
#login-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;background:#1a2e25;background-size:cover;background-position:center}
#login-screen.hide{display:none}
.login-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(14,61,43,.92) 0%,rgba(26,107,74,.80) 100%)}
.login-box{position:relative;background:rgba(255,255,255,.97);border-radius:24px;padding:48px 44px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,.3);z-index:1}
.login-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.login-logo-img{width:52px;height:52px;border-radius:12px;background:var(--em);display:flex;align-items:center;justify-content:center;overflow:hidden}
.login-logo-img img{width:100%;height:100%;object-fit:cover;display:none}
.login-logo-img .icon-fallback{display:flex}
.login-logo-text h2{font-size:22px;color:var(--em);line-height:1.1}
.login-logo-text p{font-size:11px;color:var(--text3);margin-top:2px}
.login-role-tabs{display:flex;gap:6px;margin-bottom:28px;background:var(--em-light);padding:5px;border-radius:var(--radius-sm)}
.role-tab{flex:1;padding:8px;text-align:center;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text2);transition:.2s}
.role-tab.active{background:var(--em);color:#fff;box-shadow:0 2px 8px rgba(26,107,74,.3)}
.form-group{margin-bottom:18px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;letter-spacing:.3px;text-transform:uppercase}
.form-input,.form-select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:#fff;color:var(--text);transition:.2s;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(26,107,74,.1)}
.btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--em),var(--em2));color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;letter-spacing:.3px}
.btn-login:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(26,107,74,.35)}
.login-error{background:#fff0f0;border:1px solid #fca5a5;color:#dc2626;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:16px;display:none}

/* ── LAYOUT ── */
#app{display:none;min-height:100vh}
#app.show{display:flex}

/* Sidebar */
#sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--em3) 0%,var(--em2) 100%);min-height:100vh;display:flex;flex-direction:column;transition:transform .3s,width .3s;position:fixed;left:0;top:0;bottom:0;z-index:200;overflow:hidden}
#sidebar.collapsed{width:0;transform:translateX(-100%)}
.sidebar-header{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:40px;height:40px;border-radius:10px;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover;display:none}
.brand-logo .icon-fb{display:flex}
.brand-name h3{color:#fff;font-size:17px;font-family:'Playfair Display',serif;white-space:nowrap}
.brand-name p{color:rgba(255,255,255,.5);font-size:10px;margin-top:1px;white-space:nowrap}
.sidebar-user{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.user-info{display:flex;align-items:center;gap:10px}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;color:var(--em3);font-weight:700;font-size:14px;flex-shrink:0}
.user-detail p{color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.user-detail span{color:rgba(255,255,255,.5);font-size:11px;text-transform:capitalize}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0}
.nav-section{padding:8px 18px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;color:rgba(255,255,255,.7);transition:.2s;border-left:3px solid transparent;font-size:14px;font-weight:500;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(201,168,76,.15);color:var(--gold);border-left-color:var(--gold)}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0}
.btn-logout{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);color:rgba(255,255,255,.7);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s}
.btn-logout:hover{background:rgba(220,38,38,.2);color:#fca5a5;border-color:rgba(220,38,38,.3)}

/* Main */
#main{flex:1;margin-left:var(--sidebar-w);transition:margin .3s;display:flex;flex-direction:column;min-height:100vh}
#main.expanded{margin-left:0}

/* Header */
#header{height:var(--header-h);background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.btn-toggle{width:36px;height:36px;border-radius:8px;background:transparent;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);transition:.2s;flex-shrink:0}
.btn-toggle:hover{background:var(--em-light);color:var(--em)}
.header-title{flex:1}
.header-title h2{font-size:17px;color:var(--text);font-weight:700}
.header-title p{font-size:12px;color:var(--text3);margin-top:1px}
.header-date{font-size:12px;color:var(--text3);text-align:right}

/* Content */
#content{flex:1;padding:24px;overflow-y:auto}

/* Cards/Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:16px;transition:.2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-icon{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stat-icon svg{width:26px;height:26px}
.stat-info p{font-size:26px;font-weight:700;color:var(--text);line-height:1}
.stat-info span{font-size:12px;color:var(--text3);font-weight:500;margin-top:4px;display:block}

/* Section */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.section-title{font-size:18px;font-weight:700;color:var(--text)}
.section-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Table */
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden}
.data-table{width:100%;border-collapse:collapse;font-size:13.5px}
.data-table th{background:var(--em-light);color:var(--em);font-weight:700;padding:12px 14px;text-align:left;border-bottom:2px solid var(--border);font-size:12px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.data-table td{padding:11px 14px;border-bottom:1px solid #f0f4f2;color:var(--text);vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#fafcfb}
.data-table .actions{display:flex;gap:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s;border:none;white-space:nowrap}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-primary{background:var(--em);color:#fff}
.btn-primary:hover{background:var(--em2);transform:translateY(-1px)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold2)}
.btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.btn-danger:hover{background:#dc2626;color:#fff}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-outline{background:#fff;border:1.5px solid var(--border);color:var(--text2)}
.btn-outline:hover{border-color:var(--em);color:var(--em);background:var(--em-light)}
.btn-icon{padding:7px;border-radius:6px}

/* Badge */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge-em{background:var(--em-light);color:var(--em)}
.badge-gold{background:var(--gold-light);color:var(--gold2)}
.badge-red{background:#fee2e2;color:#dc2626}
.badge-blue{background:#eff6ff;color:#3b82f6}
.badge-gray{background:#f3f4f6;color:#6b7280}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-bg.hide{display:none}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.25)}
.modal-header{padding:24px 28px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-header h3{font-size:18px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px;line-height:1}
.modal-close:hover{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.modal-body{padding:0 28px 28px}
.modal-footer{padding:0 28px 28px;display:flex;gap:10px;justify-content:flex-end}

/* Form */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.3px}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:#fff;color:var(--text);transition:.2s;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--em);box-shadow:0 0 0 3px rgba(26,107,74,.1)}
.form-textarea{resize:vertical;min-height:80px}
.checkbox-group{display:flex;flex-wrap:wrap;gap:8px}
.checkbox-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;cursor:pointer;font-size:13px;transition:.2s}
.checkbox-item:has(input:checked){border-color:var(--em);background:var(--em-light);color:var(--em)}
.checkbox-item input{accent-color:var(--em)}

/* Toast */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:9000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.15);animation:slideIn .3s ease;max-width:300px}
.toast-success{background:var(--em);color:#fff}
.toast-error{background:#dc2626;color:#fff}
.toast-info{background:#3b82f6;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Progress bar */
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex:1}
.progress-fill{height:100%;background:var(--em);border-radius:3px;transition:.3s}

/* Guru nilai input */
.nilai-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.kelas-tabs{display:flex;gap:6px}
.kelas-tab{padding:8px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:#fff;transition:.2s}
.kelas-tab.active{background:var(--em);color:#fff;border-color:var(--em)}
.mapel-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.mapel-tab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);color:var(--text2);background:#fff;transition:.2s}
.mapel-tab.active{background:var(--gold);color:#fff;border-color:var(--gold)}

.nilai-input{width:60px;padding:5px 7px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:inherit;outline:none;transition:.2s}
.nilai-input:focus{border-color:var(--em);box-shadow:0 0 0 2px rgba(26,107,74,.1)}
.nilai-final{font-weight:700;color:var(--em);font-size:14px}

/* Mobile cards */
.siswa-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;cursor:pointer;transition:.2s}
.siswa-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.siswa-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.siswa-avatar{width:44px;height:44px;border-radius:50%;background:var(--em-light);display:flex;align-items:center;justify-content:center;color:var(--em);font-weight:700;font-size:16px;flex-shrink:0}
.siswa-card-info h4{font-size:15px;font-weight:700}
.siswa-card-info p{font-size:12px;color:var(--text3);margin-top:2px}
.siswa-nilai-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.siswa-nilai-item{text-align:center;background:var(--bg);border-radius:8px;padding:8px 4px}
.siswa-nilai-item .val{font-size:16px;font-weight:700;color:var(--em)}
.siswa-nilai-item .lbl{font-size:10px;color:var(--text3);margin-top:2px}

/* Expand panel */
.expand-panel{background:var(--em-light);border-radius:var(--radius-sm);padding:16px;margin-top:12px;display:none}
.expand-panel.open{display:block}
.expand-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

/* Legger */
.legger-table-wrap{overflow-x:auto}
.legger-table{border-collapse:collapse;font-size:11px;min-width:900px}
.legger-table th,.legger-table td{border:1px solid #ccc;padding:5px 8px;white-space:nowrap}
.legger-table th{background:var(--em);color:#fff;font-weight:700;text-align:center}
.legger-table td{text-align:center}
.legger-table tr:nth-child(even) td{background:#f9fafb}
.legger-table .col-nama{text-align:left;font-weight:600}

/* SKL Print */
@media print{
  #sidebar,#header,#toast-container,.no-print{display:none!important}
  #main{margin:0!important}
  #content{padding:0!important}
  .skl-container{max-width:none!important;margin:0!important;box-shadow:none!important;border:none!important}
  body{background:#fff}
  .page-break{page-break-after:always}
}
.skl-container{background:#fff;max-width:794px;margin:0 auto;padding:40px 50px;box-shadow:var(--shadow-lg);border-radius:var(--radius);font-family:'Times New Roman',serif}
.skl-kop{border-bottom:3px double #000;padding-bottom:12px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.kop-logo{width:80px;height:80px;object-fit:contain}
.kop-text{flex:1;text-align:center}
.kop-text h2{font-size:16px;font-weight:700;text-transform:uppercase}
.kop-text h3{font-size:18px;font-weight:700;text-transform:uppercase}
.kop-text p{font-size:12px;margin-top:2px}
.skl-title{text-align:center;margin:20px 0 16px}
.skl-title h1{font-size:18px;font-weight:700;text-transform:uppercase;text-decoration:underline}
.skl-nomor{text-align:center;font-size:13px;margin-bottom:16px}
.skl-body p{font-size:13px;line-height:2;text-align:justify}
.skl-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}
.skl-table th,.skl-table td{border:1px solid #000;padding:5px 10px}
.skl-table th{background:#f0f0f0;text-align:center;font-weight:700}
.skl-table td:nth-child(1){text-align:center;width:40px}
.skl-table td:nth-child(3){text-align:center;width:80px}
.skl-ttd{display:flex;justify-content:flex-end;margin-top:30px}
.ttd-box{text-align:center;min-width:200px}
.ttd-box p{font-size:13px;margin-bottom:60px}
.ttd-box .nama-kepsek{font-weight:700;text-decoration:underline;font-size:13px}

/* Pengaturan */
.setting-card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:20px}
.setting-card h3{font-size:15px;font-weight:700;color:var(--em);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;transition:.2s}
.upload-zone:hover{border-color:var(--em);background:var(--em-light)}
.upload-zone img{max-height:80px;max-width:200px;object-fit:contain;margin-bottom:8px}
.upload-zone p{font-size:12px;color:var(--text3)}

/* Bottom nav (mobile) */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:150;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.bottom-nav-items{display:flex;justify-content:space-around}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 12px;cursor:pointer;color:var(--text3);transition:.2s;border-radius:8px;min-width:56px}
.bnav-item.active{color:var(--em)}
.bnav-item svg{width:22px;height:22px}
.bnav-item span{font-size:10px;font-weight:600}

/* Responsive */
@media(max-width:768px){
  #sidebar{width:280px}
  #sidebar:not(.collapsed){transform:translateX(0)}
  #sidebar.collapsed{transform:translateX(-100%)}
  .sidebar-overlay{display:block!important}
  #main{margin-left:0!important}
  #content{padding:16px;padding-bottom:80px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:14px}
  .form-row{grid-template-columns:1fr}
  .header-date{display:none}
  #bottom-nav{display:block}
  .desktop-only{display:none!important}
  .table-wrap{display:none}
  .cards-view{display:block!important}
  .section-actions .btn span{display:none}
}
@media(min-width:769px){
  .mobile-only{display:none!important}
  .cards-view{display:none}
}

<script>
// ═══════════════════════════════════════════════
// FIREBASE INIT
// ═══════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyBiv-YC0KLaq6ecCc6gSlgGhdbnxulSt6c",
  databaseURL: "https://sinilai-majmaulbahrain-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sinilai-majmaulbahrain"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let currentUser = null, currentRole = null, loginRole = 'admin';
let allUsers = [], allMapel = [], allSiswa = [], allNilai = {}, pengaturan = {};
let activeMenu = null;
let debounceTimers = {};
let realTimeListeners = [];

// ═══════════════════════════════════════════════
// LOADING & INIT
// ═══════════════════════════════════════════════
window.onload = async () => {
  updateDate();
  setInterval(updateDate, 60000);
  await loadPengaturan();
  applyPengaturan();
  setTimeout(() => {
    document.getElementById('loading-screen').classList.add('hide');
    document.getElementById('login-screen').classList.remove('hide');
  }, 2200);
};

function updateDate(){
  const d = new Date();
  const opts = {weekday:'long',year:'numeric',month:'long',day:'numeric'};
  const el = document.getElementById('header-date');
  if(el) el.textContent = d.toLocaleDateString('id-ID', opts);
}

async function loadPengaturan(){
  return new Promise(res => {
    db.ref('/pengaturan').once('value', snap => {
      pengaturan = snap.val() || {};
      res();
    });
  });
}

function applyPengaturan(){
  if(pengaturan.logo){
    const els = ['logo-img-el','sidebar-logo-img'];
    els.forEach(id => {
      const el = document.getElementById(id);
      if(el){ el.src = pengaturan.logo; el.style.display = 'block'; }
    });
    document.querySelectorAll('.icon-fallback,.icon-fb').forEach(e => e.style.display = 'none');
  }
  if(pengaturan.fotoLatar){
    document.getElementById('login-screen').style.backgroundImage = `url(${pengaturan.fotoLatar})`;
  }
}

// ═══════════════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════════════
function setLoginRole(role){
  loginRole = role;
  document.querySelectorAll('.role-tab').forEach((t,i) => t.classList.toggle('active', ['admin','guru','siswa'][i] === role));
  document.getElementById('form-user').style.display = role !== 'siswa' ? 'block' : 'none';
  document.getElementById('form-siswa').style.display = role === 'siswa' ? 'block' : 'none';
  document.getElementById('login-error').style.display = 'none';
}

async function loadSiswaDrp(){
  const kelas = document.getElementById('sel-kelas-login').value;
  const sel = document.getElementById('sel-nama-login');
  sel.innerHTML = '<option value="">-- Pilih Nama --</option>';
  if(!kelas) return;
  const snap = await db.ref('/siswa').once('value');
  const list = snap.val() || [];
  const filtered = Array.isArray(list) ? list.filter(s=>s && s.kelas===kelas) : Object.values(list).filter(s=>s && s.kelas===kelas);
  filtered.sort((a,b)=>a.nama.localeCompare(b.nama));
  filtered.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id || s.nis;
    o.textContent = s.nama;
    sel.appendChild(o);
  });
}

async function doLogin(){
  const err = document.getElementById('login-error');
  err.style.display = 'none';

  if(loginRole === 'siswa'){
    const kelas = document.getElementById('sel-kelas-login').value;
    const sid = document.getElementById('sel-nama-login').value;
    if(!kelas || !sid){ showError('Pilih kelas dan nama siswa'); return; }
    const snap = await db.ref('/siswa').once('value');
    const list = snap.val() || {};
    let found = null;
    const arr = Array.isArray(list) ? list : Object.values(list);
    arr.forEach(s => { if(s && (s.id===sid || s.nis===sid)) found = s; });
    if(!found){ showError('Siswa tidak ditemukan'); return; }
    currentUser = found;
    currentRole = 'siswa';
    enterApp();
    return;
  }

  const uname = document.getElementById('inp-username').value.trim();
  const pass = document.getElementById('inp-password').value;
  if(!uname || !pass){ showError('Isi username dan password'); return; }

  if(loginRole === 'admin'){
    const snap = await db.ref('/users').once('value');
    const users = snap.val() || {};
    const arr = Array.isArray(users) ? users : Object.values(users);
    const admin = arr.find(u => u && u.role==='admin' && u.username===uname && u.password===pass);
    if(!admin){
      // default admin jika belum ada
      if(uname==='admin' && pass==='admin123'){
        currentUser = {username:'admin', nama:'Administrator', role:'admin'};
        currentRole = 'admin';
        enterApp(); return;
      }
      showError('Username atau password salah'); return;
    }
    currentUser = admin; currentRole = 'admin'; enterApp();
    return;
  }

  if(loginRole === 'guru'){
    const snap = await db.ref('/users').once('value');
    const users = snap.val() || {};
    const arr = Array.isArray(users) ? users : Object.values(users);
    const guru = arr.find(u => u && u.role==='guru' && u.username===uname && u.password===pass);
    if(!guru){ showError('Username atau password salah'); return; }
    currentUser = guru; currentRole = 'guru'; enterApp();
  }

  function showError(msg){ err.textContent = msg; err.style.display = 'block'; }
}

function enterApp(){
  document.getElementById('login-screen').classList.add('hide');
  document.getElementById('app').classList.add('show');
  setupSidebar();
  setupBottomNav();
  updateUserInfo();
  navigateTo(getDefaultMenu());
  loadAllData();
}

function getDefaultMenu(){
  if(currentRole==='admin') return 'dashboard';
  if(currentRole==='guru') return 'nilai-guru';
  return 'nilai-siswa';
}

function doLogout(){
  removeAllListeners();
  currentUser = null; currentRole = null;
  document.getElementById('app').classList.remove('show');
  document.getElementById('login-screen').classList.remove('hide');
  document.getElementById('inp-username').value = '';
  document.getElementById('inp-password').value = '';
  setLoginRole('admin');
}

// ═══════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════
function loadAllData(){
  db.ref('/users').on('value', snap => {
    const val = snap.val() || {};
    allUsers = Array.isArray(val) ? val.filter(Boolean) : Object.values(val).filter(Boolean);
  });
  db.ref('/mapel').on('value', snap => {
    const val = snap.val() || {};
    allMapel = Array.isArray(val) ? val.filter(Boolean) : Object.values(val).filter(Boolean);
  });
  db.ref('/siswa').on('value', snap => {
    const val = snap.val() || {};
    allSiswa = Array.isArray(val) ? val.filter(Boolean) : Object.values(val).filter(Boolean);
    if(activeMenu === 'data-siswa') renderPage('data-siswa');
    if(activeMenu === 'nilai-guru') renderNilaiGuru();
    if(activeMenu === 'legger') renderLegger();
    if(activeMenu === 'nilai-kelulusan') renderNilaiKelulusan();
    if(activeMenu === 'dashboard') renderDashboard();
  });
  db.ref('/nilai').on('value', snap => {
    allNilai = snap.val() || {};
    if(activeMenu === 'nilai-guru') renderNilaiGuru();
    if(activeMenu === 'legger') renderLegger();
    if(activeMenu === 'nilai-kelulusan') renderNilaiKelulusan();
    if(activeMenu === 'dashboard') renderDashboard();
    if(activeMenu === 'nilai-siswa') renderNilaiSiswa();
  });
}

function removeAllListeners(){
  ['users','mapel','siswa','nilai'].forEach(ref => db.ref('/'+ref).off());
}

// ═══════════════════════════════════════════════
// SIDEBAR & NAV
// ═══════════════════════════════════════════════
const MENUS = {
  admin:[
    {id:'dashboard', label:'Dashboard', icon:iconDashboard, section:'Menu Utama'},
    {id:'data-siswa', label:'Data Siswa', icon:iconSiswa, section:null},
    {id:'mapel', label:'Mata Pelajaran', icon:iconMapel, section:null},
    {id:'data-guru', label:'Data Guru', icon:iconGuru, section:null},
    {id:'nilai-kelulusan', label:'Nilai Kelulusan', icon:iconNilai, section:'Akademik'},
    {id:'legger', label:'Legger Nilai', icon:iconLegger, section:null},
    {id:'pengaturan', label:'Pengaturan', icon:iconSetting, section:'Sistem'},
  ],
  guru:[
    {id:'nilai-guru', label:'Input Nilai', icon:iconNilai, section:'Menu Guru'},
  ],
  siswa:[
    {id:'nilai-siswa', label:'Nilai Saya', icon:iconNilai, section:'Siswa'},
    {id:'skl-siswa', label:'Lihat SKL', icon:iconSKL, section:null},
  ]
};

function setupSidebar(){
  const menus = MENUS[currentRole] || [];
  let html = '';
  menus.forEach(m => {
    if(m.section) html += `<div class="nav-section">${m.section}</div>`;
    html += `<div class="nav-item" id="nav-${m.id}" onclick="navigateTo('${m.id}')">${m.icon()}<span>${m.label}</span></div>`;
  });
  document.getElementById('sidebar-nav').innerHTML = html;
}

function setupBottomNav(){
  const menus = MENUS[currentRole] || [];
  const shown = menus.slice(0,5);
  let html = '';
  shown.forEach(m => {
    html += `<div class="bnav-item" id="bnav-${m.id}" onclick="navigateTo('${m.id}')">${m.icon()}<span>${m.label}</span></div>`;
  });
  document.getElementById('bottom-nav-items').innerHTML = html;
}

function updateUserInfo(){
  const name = currentUser?.nama || currentUser?.username || 'Pengguna';
  document.getElementById('user-name').textContent = name;
  document.getElementById('user-role').textContent = currentRole;
  document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
}

function toggleSidebar(){
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const collapsed = sb.classList.toggle('collapsed');
  if(window.innerWidth > 768){
    document.getElementById('main').classList.toggle('expanded', collapsed);
  } else {
    ov.style.display = collapsed ? 'none' : 'block';
  }
}
function closeSidebar(){
  document.getElementById('sidebar').classList.add('collapsed');
  document.getElementById('sidebar-overlay').style.display = 'none';
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function navigateTo(id){
  activeMenu = id;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-'+id);
  if(navEl) navEl.classList.add('active');
  const bnavEl = document.getElementById('bnav-'+id);
  if(bnavEl) bnavEl.classList.add('active');

  const menuDef = (MENUS[currentRole]||[]).find(m=>m.id===id);
  document.getElementById('page-title').textContent = menuDef?.label || id;

  if(window.innerWidth <= 768) closeSidebar();

  switch(id){
    case 'dashboard': renderDashboard(); break;
    case 'data-siswa': renderPage('data-siswa'); break;
    case 'mapel': renderMapel(); break;
    case 'data-guru': renderDataGuru(); break;
    case 'nilai-kelulusan': renderNilaiKelulusan(); break;
    case 'legger': renderLegger(); break;
    case 'pengaturan': renderPengaturan(); break;
    case 'nilai-guru': renderNilaiGuru(); break;
    case 'nilai-siswa': renderNilaiSiswa(); break;
    case 'skl-siswa': renderSKLSiswa(); break;
  }
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
function renderDashboard(){
  const totalSiswa = allSiswa.length;
  const totalMapel = allMapel.length;
  const totalGuru = allUsers.filter(u=>u.role==='guru').length;
  let nilaiLengkap = 0;
  allSiswa.forEach(s => {
    const mapelCount = allMapel.length;
    if(mapelCount === 0) return;
    let filled = 0;
    allMapel.forEach(m => {
      const k = `${s.id}_${m.id}`;
      if(allNilai[k]) filled++;
    });
    if(filled === mapelCount) nilaiLengkap++;
  });

  const byKelas = {IX1:0,IX2:0,IX3:0};
  allSiswa.forEach(s => {
    if(s.kelas==='IX-1') byKelas.IX1++;
    else if(s.kelas==='IX-2') byKelas.IX2++;
    else if(s.kelas==='IX-3') byKelas.IX3++;
  });

  document.getElementById('content').innerHTML = `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon" style="background:#e8f5ef">${iconSiswa('#1a6b4a')}</div>
      <div class="stat-info"><p>${totalSiswa}</p><span>Total Siswa Kelas IX</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#fdf6e3">${iconMapel('#c9a84c')}</div>
      <div class="stat-info"><p>${totalMapel}</p><span>Mata Pelajaran</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#eff6ff">${iconGuru('#3b82f6')}</div>
      <div class="stat-info"><p>${totalGuru}</p><span>Data Guru</span></div>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background:#f0fdf4">${iconNilai('#16a34a')}</div>
      <div class="stat-info"><p>${nilaiLengkap}</p><span>Nilai Lengkap</span></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px" class="dash-grid">
    <div class="table-wrap" style="padding:20px">
      <h3 style="font-size:15px;font-weight:700;color:var(--em);margin-bottom:16px">Siswa per Kelas</h3>
      ${['IX-1','IX-2','IX-3'].map((k,i) => {
        const n = [byKelas.IX1,byKelas.IX2,byKelas.IX3][i];
        const pct = totalSiswa ? Math.round(n/totalSiswa*100) : 0;
        return `<div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:13px;font-weight:600">${k}</span>
            <span style="font-size:13px;color:var(--text3)">${n} siswa (${pct}%)</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="table-wrap" style="padding:20px">
      <h3 style="font-size:15px;font-weight:700;color:var(--em);margin-bottom:16px">Status Nilai</h3>
      <div style="text-align:center;padding:20px 0">
        <div style="font-size:48px;font-weight:700;color:var(--em)">${totalSiswa ? Math.round(nilaiLengkap/totalSiswa*100) : 0}%</div>
        <div style="color:var(--text3);font-size:13px;margin-top:8px">Kelengkapan Nilai</div>
        <div style="margin-top:16px;font-size:13px;color:var(--text2)">${nilaiLengkap} dari ${totalSiswa} siswa<br>memiliki nilai lengkap</div>
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <span style="font-weight:700;font-size:15px">5 Siswa Terbaru</span>
    </div>
    <table class="data-table">
      <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th></tr></thead>
      <tbody>
        ${allSiswa.slice(-5).reverse().map((s,i) => `
          <tr><td>${i+1}</td><td>${s.nis||'-'}</td><td>${s.nama}</td><td><span class="kelas-chip">${s.kelas}</span></td></tr>
        `).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--text3);padding:20px">Belum ada data siswa</td></tr>'}
      </tbody>
    </table>
  </div>`;

  // responsive fix
  if(window.innerWidth <= 768){
    document.querySelector('.dash-grid') && (document.querySelector('.dash-grid').style.gridTemplateColumns = '1fr');
  }
}

// ═══════════════════════════════════════════════
// DATA SISWA
// ═══════════════════════════════════════════════
function renderPage(page){
  if(page !== 'data-siswa') return;
  const content = document.getElementById('content');
  content.innerHTML = `
  <div class="section-header">
    <div class="section-title">Data Siswa</div>
    <div class="section-actions">
      <input class="form-input" id="search-siswa" placeholder="Cari nama/NIS..." style="width:200px;padding:8px 12px" oninput="filterSiswa()" />

        <option value="">Semua Kelas</option>
        <option>IX-1</option><option>IX-2</option><option>IX-3</option>
      </select>
      <button class="btn btn-primary" onclick="openModalSiswa(null)">

      </button>

      <tbody id="tbody-siswa"></tbody>
    </table>
  </div>
  <div class="cards-view" id="cards-siswa"></div>`;

}

function filterSiswa(){
  renderSiswaList();
}

function renderSiswaList(){
  const q = (document.getElementById('search-siswa')?.value||'').toLowerCase();
  const kf = document.getElementById('filter-kelas')?.value||'';
  const filtered = allSiswa.filter(s => {
    const match = s.nama.toLowerCase().includes(q) || (s.nis||'').includes(q);
    const kMatch = !kf || s.kelas===kf;
    return match && kMatch;
  });

  const tbody = document.getElementById('tbody-siswa');
  if(tbody) tbody.innerHTML = filtered.map((s,i) => `
    <tr>
      <td>${i+1}</td><td>${s.nis||'-'}</td><td>${s.nisn||'-'}</td>
      <td><strong>${s.nama}</strong></td>
      <td>${s.jk||'-'}</td>
      <td><span class="kelas-chip">${s.kelas||'-'}</span></td>
      <td>${s.namaOrtu||'-'}</td>
      <td><div class="actions">
        <button class="btn btn-outline btn-sm btn-icon" onclick='openModalSiswa(${JSON.stringify(s)})' title="Edit">${iconEdit()}</button>
        <button class="btn btn-danger btn-sm btn-icon" onclick="hapusSiswa('${s.id}')" title="Hapus">${iconTrash()}</button>
      </div></td>
    </tr>`).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:24px">Belum ada data</td></tr>';

  const cards = document.getElementById('cards-siswa');
  if(cards) cards.innerHTML = filtered.map(s => `
    <div class="siswa-card">
      <div class="siswa-card-header">
        <div class="siswa-avatar">${s.nama.charAt(0)}</div>
        <div class="siswa-card-info">
          <h4>${s.nama}</h4>
          <p>NIS: ${s.nis||'-'} · ${s.kelas}</p>
        </div>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button class="btn btn-outline btn-sm btn-icon" onclick='openModalSiswa(${JSON.stringify(s)})'>${iconEdit()}</button>
          <button class="btn btn-danger btn-sm btn-icon" onclick="hapusSiswa('${s.id}')">${iconTrash()}</button>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text3)">NISN: ${s.nisn||'-'} · Orang Tua: ${s.namaOrtu||'-'}</div>
    </div>`).join('') || '<div style="text-align:center;color:var(--text3);padding:40px">Belum ada data</div>';
}

function openModalSiswa(siswa){
  const isEdit = !!siswa;
  showModal(isEdit ? 'Edit Siswa' : 'Tambah Siswa', `
    <div class="form-row">
      <div class="form-group"><label class="form-label">NIS</label><input class="form-input" id="f-nis" value="${siswa?.nis||''}"/></div>
      <div class="form-group"><label class="form-label">NISN</label><input class="form-input" id="f-nisn" value="${siswa?.nisn||''}"/></div>

          <option ${siswa?.jk==='P'?'selected':''}>P</option>

          <option ${siswa?.kelas==='IX-1'?'selected':''}>IX-1</option>
          <option ${siswa?.kelas==='IX-2'?'selected':''}>IX-2</option>
          <option ${siswa?.kelas==='IX-3'?'selected':''}>IX-3</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Nama Orang Tua</label><input class="form-input" id="f-ortu" value="${siswa?.namaOrtu||''}"/></div>
  `, [
    {label:'Batal', cls:'btn-outline', action:'closeModal()'},
    {label:isEdit?'Simpan':'Tambah', cls:'btn-primary', action:`saveSiswa('${siswa?.id||''}')`}
  ]);
}

function saveSiswa(id){
  const data = {
    nis: v('f-nis'), nisn: v('f-nisn'), nama: v('f-nama'),
    tempatLahir: v('f-ttl'), tanggalLahir: v('f-tgl'),
    jk: v('f-jk'), kelas: v('f-kelas'), namaOrtu: v('f-ortu')
  };
  if(!data.nama){ toast('Nama wajib diisi','error'); return; }
  if(id){
    data.id = id;
    db.ref('/siswa/'+id).set(data).then(() => { toast('Siswa diperbarui'); closeModal(); });
  } else {
    const newId = 'siswa_'+Date.now();
    data.id = newId;
    db.ref('/siswa/'+newId).set(data).then(() => { toast('Siswa ditambahkan'); closeModal(); });
  }
}

function hapusSiswa(id){
  if(!confirm('Hapus siswa ini?')) return;
  db.ref('/siswa/'+id).remove().then(() => toast('Siswa dihapus'));
}

function openModalMapel(mapel){

      <select class="form-select" id="f-mapel-guru">
        <option value="">-- Pilih Guru --</option>
        ${gurus.map(g=>`<option value="${g.id}" ${(g.mapelIds||[]).includes(mapel?.id)?'selected':''}>${g.nama}</option>`).join('')}
      </select>
    </div>
  `, [
    {label:'Batal',cls:'btn-outline',action:'closeModal()'},
    {label:mapel?'Simpan':'Tambah',cls:'btn-primary',action:`saveMapel('${mapel?.id||''}')`}
  ]);
}

function saveMapel(id){
  const data = { nama: v('f-mapel-nama'), kode: v('f-mapel-kode') };
  if(!data.nama){ toast('Nama mapel wajib diisi','error'); return; }
  const guruId = v('f-mapel-guru');
  if(id){
    data.id = id;
    db.ref('/mapel/'+id).set(data).then(() => {
      if(guruId) updateGuruMapel(guruId, id);
      toast('Mapel diperbarui'); closeModal(); renderMapel();
    });
  } else {
    const newId = 'mapel_'+Date.now();
    data.id = newId;
    db.ref('/mapel/'+newId).set(data).then(() => {
      if(guruId) updateGuruMapel(guruId, newId);
      toast('Mapel ditambahkan'); closeModal(); renderMapel();
    });
  }
}

function updateGuruMapel(guruId, mapelId){
  const guru = allUsers.find(u=>u.id===guruId);
  if(!guru) return;
  const ids = guru.mapelIds || [];
  if(!ids.includes(mapelId)) ids.push(mapelId);
  db.ref('/users/'+guruId+'/mapelIds').set(ids);
}

function hapusMapel(id){
  if(!confirm('Hapus mata pelajaran ini?')) return;
  db.ref('/mapel/'+id).remove().then(() => { toast('Mapel dihapus'); renderMapel(); });
}

function renderNilaiKelulusan(){
  let html = `
  <div class="section-header">
    <div class="section-title">Nilai Kelulusan</div>
    <div class="section-actions">
      <select class="form-select" id="filter-kelas-nk" style="width:120px;padding:8px" onchange="renderNilaiKelulusan()">
        <option value="">Semua Kelas</option><option>IX-1</option><option>IX-2</option><option>IX-3</option>
      </select>
    </div>
  </div>
  <div class="table-wrap desktop-only">
    <table class="data-table">
      <thead><tr><th>No</th><th>NIS</th><th>Nama</th><th>Kelas</th><th>Kelengkapan Nilai</th><th>Nilai Akhir</th><th>Aksi</th></tr></thead>
      <tbody id="tbody-nk"></tbody>
    </table>
  </div>
  <div class="cards-view" id="cards-nk"></div>`;
  document.getElementById('content').innerHTML = html;

  const kf = document.getElementById('filter-kelas-nk')?.value||'';
  const filtered = allSiswa.filter(s => !kf || s.kelas===kf);

  const rows = filtered.map((s,i) => {
    let filled = 0;
    let totalNilai = 0, countNilai = 0;
    allMapel.forEach(m => {
      const k = `${s.id}_${m.id}`;
      if(allNilai[k]){ filled++; const na = hitungNilaiAkhir(allNilai[k]); totalNilai += na; countNilai++; }
    });
    const pct = allMapel.length ? Math.round(filled/allMapel.length*100) : 0;
    const avg = countNilai ? (totalNilai/countNilai).toFixed(2) : '-';
    return {s, filled, pct, avg, i};
  });

  const tbody = document.getElementById('tbody-nk');
  if(tbody) tbody.innerHTML = rows.map(({s,filled,pct,avg,i}) => `
    <tr>
      <td>${i+1}</td><td>${s.nis||'-'}</td><td><strong>${s.nama}</strong></td>
      <td><span class="kelas-chip">${s.kelas}</span></td>
      <td>
        <div class="nilai-progress-row">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="nilai-count">${filled}/${allMapel.length}</span>
        </div>
      </td>
      <td><strong style="color:var(--em)">${avg}</strong></td>
      <td><button class="btn btn-gold btn-sm" onclick="cetakSKL('${s.id}')">${iconPrint()} Cetak SKL</button></td>
    </tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:24px">Belum ada data</td></tr>';

  const cards = document.getElementById('cards-nk');
  if(cards) cards.innerHTML = rows.map(({s,filled,pct,avg}) => `
    <div class="siswa-card">
      <div class="siswa-card-header">
        <div class="siswa-avatar">${s.nama.charAt(0)}</div>
        <div class="siswa-card-info"><h4>${s.nama}</h4><p>${s.nis||'-'} · ${s.kelas}</p></div>
      </div>
      <div style="margin-bottom:8px">
        <div class="nilai-progress-row" style="margin-bottom:4px">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="nilai-count">${filled}/${allMapel.length}</span>
        </div>
        <span style="font-size:11px;color:var(--text3)">Nilai Akhir: <strong style="color:var(--em)">${avg}</strong></span>
      </div>
      <button class="btn btn-gold btn-sm" style="width:100%" onclick="cetakSKL('${s.id}')">${iconPrint()} Cetak SKL</button>
    </div>`).join('');
}

  </div>

    <table class="legger-table" id="legger-tbl">
      <thead id="legger-thead"></thead>
      <tbody id="legger-tbody"></tbody>
    </table>
  </div>`;
  document.getElementById('content').innerHTML = html;

  const kf = document.getElementById('filter-kelas-lg')?.value||'';
  const filtered = allSiswa.filter(s => !kf || s.kelas===kf);

  const thead = document.getElementById('legger-thead');

  thead.innerHTML = `<tr>
    <th>No</th><th>NIS</th><th>Nama Siswa</th><th>Kelas</th>

  </tr>`;

  const tbody = document.getElementById('legger-tbody');
  tbody.innerHTML = filtered.map((s,i) => {
    let total=0, count=0;
    const cols = allMapel.map(m => {
      const k = `${s.id}_${m.id}`;
      const na = allNilai[k] ? hitungNilaiAkhir(allNilai[k]) : null;
      if(na !== null){ total+=na; count++; }
      return `<td>${na !== null ? na.toFixed(0) : '-'}</td>`;
    }).join('');
    const avg = count ? (total/count).toFixed(2) : '-';
    return `<tr>
      <td>${i+1}</td><td>${s.nis||'-'}</td>
      <td class="col-nama">${s.nama}</td>
      <td>${s.kelas}</td>${cols}
      <td><strong>${avg}</strong></td>
    </tr>`;
  }).join('')||`<tr><td colspan="${4+allMapel.length+1}" style="text-align:center;padding:20px;color:#999">Belum ada data</td></tr>`;
}

function uploadFile(key, inp){
  const file = inp.files[0];
  if(!file) return;
  if(file.size > 500000){ toast('File terlalu besar (maks 500KB)','error'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const b64 = e.target.result;
    pengaturan[key] = b64;
    db.ref('/pengaturan/'+key).set(b64).then(() => {
      toast('File berhasil diupload');
      applyPengaturan();
      renderPengaturan();
    });
  };
  reader.readAsDataURL(file);
}

function saveInfoSekolah(){
  const updates = {
    kepsek: v('f-kepsek'), nipKepsek: v('f-nip'),
    alamat: v('f-alamat'), tahunPelajaran: v('f-tp')
  };
  Object.assign(pengaturan, updates);
  db.ref('/pengaturan').update(updates).then(() => toast('Informasi disimpan'));
}

function gantiPasswordAdmin(){
  const pass = v('f-pass-baru'), konfirm = v('f-pass-konfirm');
  if(!pass){ toast('Isi password baru','error'); return; }
  if(pass !== konfirm){ toast('Password tidak cocok','error'); return; }
  const admin = allUsers.find(u=>u.role==='admin' && u.username===currentUser.username);
  if(admin) db.ref('/users/'+admin.id+'/password').set(pass).then(() => toast('Password berhasil diubah'));
}

function toggleExpandNilai(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('open');

function updateNA(siswaId, mapelId, row){
  const inputs = row.querySelectorAll('input.nilai-input');
  const fields = ['s1','s2','s3','s4','s5','usMapel','us4Mapel','praktik'];
  const d = {};
  inputs.forEach((inp,i) => { if(inp.value.trim()) d[fields[i]] = parseFloat(inp.value)||0; });
  const na = hitungNilaiAkhir(d);
  const el = document.getElementById('na-'+siswaId);
  if(el) el.textContent = na ? na.toFixed(2) : '-';
}

function saveNilaiDebounce(siswaId, mapelId, field, val){
  const key = `${siswaId}_${mapelId}_${field}`;
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(() => {
    const dbKey = `${siswaId}_${mapelId}`;
    const parsed = val.trim() !== '' ? parseFloat(val)||0 : null;
    if(parsed !== null){
      db.ref('/nilai/'+dbKey+'/'+field).set(parsed);
    } else {
      db.ref('/nilai/'+dbKey+'/'+field).remove();
    }
    // Update local
    if(!allNilai[dbKey]) allNilai[dbKey] = {};
    if(parsed !== null) allNilai[dbKey][field] = parsed;
    else delete allNilai[dbKey][field];
    // Update nilai akhir display
    const na = hitungNilaiAkhir(allNilai[dbKey]||{});
    const el = document.getElementById('na-'+siswaId);
    if(el) el.textContent = na ? na.toFixed(2) : '-';
  }, 800);
}

// FORMULA NILAI
// ═══════════════════════════════════════════════
function hitungNilaiAkhir(d){
  if(!d) return 0;
  const raporFields = ['s1','s2','s3','s4','s5'];
  const raporVals = raporFields.map(f => d[f]).filter(v => v !== undefined && v !== null && v !== '');
  const rataRaport = raporVals.length ? raporVals.reduce((a,b)=>a+parseFloat(b),0)/raporVals.length : 0;

  const kompFields = ['usMapel','us4Mapel','praktik'];
  const kompVals = kompFields.map(f => d[f]).filter(v => v !== undefined && v !== null && v !== '');
  const rataKomp = kompVals.length ? kompVals.reduce((a,b)=>a+parseFloat(b),0)/kompVals.length : 0;

  if(raporVals.length === 0 && kompVals.length === 0) return 0;
  const hasRaport = raporVals.length > 0;
  const hasKomp = kompVals.length > 0;

  if(hasRaport && hasKomp) return (rataRaport * 0.6) + (rataKomp * 0.4);
  if(hasRaport) return rataRaport;
  return rataKomp;
}

// RESPONSIVE SIDEBAR
// ═══════════════════════════════════════════════
window.addEventListener('resize', () => {
  if(window.innerWidth > 768){
    document.getElementById('sidebar-overlay').style.display = 'none';
    document.getElementById('sidebar').classList.remove('collapsed');
    document.getElementById('main').classList.remove('expanded');
  }
});

// Sidebar collapsed on mobile by default
if(window.innerWidth <= 768){
  document.getElementById('sidebar').classList.add('collapsed');
}
</script>
